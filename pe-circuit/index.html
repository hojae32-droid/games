<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서킷 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gugi&family=Russo+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Gugi','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;background:#0B1020;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid #60A5FA;outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(260px,24vw) minmax(0,1fr)}
@media (max-width:820px),(max-aspect-ratio:4/5){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1.3fr) minmax(0,1fr)}.side{order:2;border-right:0!important;border-top:3px solid #1E293B}}
.side{background:#0F172A;border-right:3px solid #1E293B;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.side h1{margin:0;font-weight:400;font-size:24px}
.side h1 em{font-style:normal;color:#F472B6}
.side h3{margin:0 0 6px;font-weight:400;font-size:15px;color:#94A3B8}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border:2px solid #334155;background:transparent;border-radius:999px;padding:5px 11px;font-size:14px}
.seg button.on{background:#F472B6;border-color:#F472B6;color:#1E0B19}
.st{display:flex;align-items:center;gap:6px;background:#1E293B;border-radius:12px;padding:5px 6px;margin-bottom:5px}
.st b{width:26px;text-align:center;color:#94A3B8;font-weight:400}
.st input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font-size:17px;padding:4px}
.st button{border:0;background:transparent;font-size:16px;opacity:.7}
.add{width:100%;border:2px dashed #334155;background:transparent;border-radius:12px;padding:6px;font-size:15px;color:#94A3B8}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nums label{display:flex;flex-direction:column;align-items:center;background:#1E293B;border-radius:12px;padding:6px;font-size:13px;color:#94A3B8}
.nums input{width:100%;text-align:center;font-size:24px;background:transparent;border:0;color:#fff}
.total{font-size:14px;color:#94A3B8;text-align:center}
.main{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:2vh 2vw;gap:1vh;background:radial-gradient(circle at 50% 50%,var(--glow,#1E293B) 0,#0B1020 65%);transition:background .6s}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phase{font-size:clamp(22px,4vh,40px);border-radius:999px;padding:.1em .8em;background:var(--pc,#334155)}
.round{font-size:clamp(16px,2.6vh,26px);color:#CBD5E1}
.sp{flex:1}
.tb{border:0;border-radius:12px;padding:8px 14px;font-size:16px;background:rgba(255,255,255,.12)}
.center{display:grid;place-items:center;min-height:0;position:relative;container-type:size}
.ring{position:relative;width:min(100cqw,100cqh);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:7}
.ring .fg{fill:none;stroke:var(--pc,#F472B6);stroke-width:7;stroke-linecap:round;transition:stroke .3s}
.inner{pointer-events:none;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.emo{font-size:clamp(28px,16cqmin,130px);line-height:1}
.ex{font-size:clamp(16px,8cqmin,64px);line-height:1.15;max-width:90%;word-break:keep-all}
.sec{font-family:Orbitron,monospace;font-size:clamp(34px,20cqmin,170px);line-height:1;color:#fff;text-shadow:0 0 30px var(--pc,#F472B6)}
.sec.pulse{animation:pl .4s ease}
@keyframes pl{from{transform:scale(1.2)}}
.next{text-align:center;font-size:clamp(16px,3vh,30px);color:#CBD5E1}
.next b{font-weight:400;color:#fff}
.ctrl{display:flex;justify-content:center;gap:12px;margin-top:.6vh}
.big{border:0;border-radius:16px;padding:12px 28px;font-size:clamp(18px,3vh,28px);background:#22C55E;color:#052E16;box-shadow:0 5px 0 #15803D}
.big.pause{background:#F59E0B;color:#3A2300;box-shadow:0 5px 0 #B45309}
.big.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.done{position:absolute;inset:0;display:none;place-items:center;background:rgba(11,16,32,.85);font-size:clamp(40px,9vh,100px);color:#FDE047;text-align:center}
.done.on{display:grid}
.maker{position:fixed;right:10px;bottom:4px;font-size:12px;color:rgba(255,255,255,.4)}
/* ── 새 디자인: 네오브루탈 부트캠프 (라임 + 검정 굵은 테두리) ── */
body{background:#d9f542;color:#111}
.side{background:#fff;border-right:5px solid #111;color:#111}
@media (max-width:820px),(max-aspect-ratio:4/5){.side{border-top:5px solid #111!important}}
.side h1 em{color:#ff3d81}
.side h3{color:#444}
.seg button{border:3px solid #111;color:#111;background:#fff;box-shadow:0 3px 0 #111}
.seg button.on{background:#ff3d81;border-color:#111;color:#fff}
.st{background:#f1f5c4;border:3px solid #111;border-radius:10px}
.st b{color:#111}.st input{color:#111}
.add{border:3px dashed #111;color:#111}
.nums label{background:#f1f5c4;border:3px solid #111;color:#111;border-radius:10px}
.nums input{color:#111}
.total{color:#333}
.main{background:#d9f542!important}
.round{color:#111}
.phase{color:#fff;border:4px solid #111;box-shadow:0 4px 0 #111}
.tb{background:#fff;color:#111;border:3px solid #111;box-shadow:0 3px 0 #111;border-radius:10px}
.ring .bg{stroke:rgba(0,0,0,.14)}
.ring .fg{stroke:#111}
.sec{font-family:'Russo One',Orbitron,monospace;font-weight:400;color:#111;text-shadow:4px 4px 0 var(--pc,#ff3d81)}
.ex{color:#111}
.next{color:#222}.next b{color:#d6246c}
.big{background:#111;color:#d9f542;box-shadow:0 5px 0 #555;border-radius:12px}
.big.pause{background:#ff3d81;color:#fff;box-shadow:0 5px 0 #8f1e47}
.big.ghost{background:#fff;color:#111;border:3px solid #111;box-shadow:0 4px 0 #111}
.done{background:rgba(217,245,66,.94);color:#111}.done span{color:#111!important}
.maker{color:rgba(0,0,0,.55)}

</style>
</head>
<body>
<div class="app">
  <div class="side">
    <h1>⏱️ 서킷 <em>타이머</em></h1>
    <div><h3>예시 순서 불러오기</h3><div class="seg" id="pre"></div></div>
    <div><h3>운동 순서 (정거장)</h3><div id="list"></div><button class="add" id="add">＋ 운동 더하기</button></div>
    <div class="nums"><label>운동(초)<input id="work" type="number" min="5" max="600" value="30"></label><label>쉬기(초)<input id="rest" type="number" min="0" max="300" value="15"></label><label>바퀴<input id="sets" type="number" min="1" max="10" value="2"></label></div>
    <div><h3>정거장 이동</h3><div class="seg" id="mv"><button data-v="0" class="on">쉬는 시간에 이동</button><button data-v="1">모두 같은 운동</button></div></div>
    <div class="total" id="total"></div>
  </div>
  <div class="main" id="main">
    <div class="top"><span class="phase" id="phase">준비</span><span class="round" id="round"></span><div class="sp"></div><button class="tb" id="fs">⛶ 전체 화면</button></div>
    <div class="center"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="bg"/><circle cx="50" cy="50" r="44" class="fg" id="arc" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
      <div class="inner"><div class="emo" id="emo">💪</div><div class="ex" id="ex">시작을 눌러요</div><div class="sec" id="sec">30</div></div></div></div>
    <div><div class="next" id="next"></div><div class="ctrl"><button class="big ghost" id="prev">⏮</button><button class="big" id="go">▶ 시작</button><button class="big ghost" id="skip">⏭</button><button class="big ghost" id="stop">⏹</button></div></div>
    <div class="done" id="done"><div>🎉 서킷 완료!<br><span style="font-size:.4em;color:#fff">물 마시고 정리 운동을 해요</span></div></div>
  </div>
</div>
<div class="maker">제작 : 비춤이샘</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const PRE={
  '기초 체력':['🦘 제자리 높이뛰기','💪 팔굽혀펴기','🧘 윗몸 말아 올리기','🏃 제자리 뛰기','🦵 스쿼트','🧍 플랭크'],
  '줄넘기':['🪢 모아 뛰기','🪢 번갈아 뛰기','🪢 엇걸어 뛰기','🪢 뒤로 뛰기','🪢 이중 뛰기 도전'],
  '유연성':['🙆 목 돌리기','🤸 옆구리 늘이기','🧎 앉아 윗몸 앞으로 굽히기','🦋 나비 자세','🐈 고양이 자세'],
  '민첩성':['↔️ 사이드 스텝','🪜 사다리 스텝','🔁 왕복 달리기','⚡ 버피','🐸 개구리 점프'],
  '준비 운동':['🙆 목 운동','💫 어깨 돌리기','🤸 허리 돌리기','🦵 무릎 돌리기','🦶 발목 돌리기','🏃 가볍게 뛰기'],
};
let list=PRE['기초 체력'].slice(),move=0,steps=[],idx=0,left=0,run=false,last=0,ac=null,lastBeep=-1;
try{const sv=JSON.parse(localStorage.getItem('bichum-circuit')||'null');if(sv){list=sv.list;$('work').value=sv.work;$('rest').value=sv.rest;$('sets').value=sv.sets;}}catch(e){}
function save(){try{localStorage.setItem('bichum-circuit',JSON.stringify({list,work:$('work').value,rest:$('rest').value,sets:$('sets').value}));}catch(e){}}
function beep(f,d,v=.2){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$('pre').innerHTML=Object.keys(PRE).map(k=>`<button data-k="${k}">${k}</button>`).join('');
$('pre').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;list=PRE[b.dataset.k].slice();ui();};
function ui(){$('list').innerHTML=list.map((x,i)=>`<div class="st"><b>${i+1}</b><input data-i="${i}" value="${x.replace(/"/g,'&quot;')}"><button data-u="${i}" aria-label="위로">↑</button><button data-x="${i}" aria-label="지우기">✕</button></div>`).join('');build();save();}
$('list').oninput=e=>{const t=e.target.closest('input');if(t){list[+t.dataset.i]=t.value;build();save();}};
$('list').onclick=e=>{const u=e.target.closest('[data-u]'),x=e.target.closest('[data-x]');if(u){const i=+u.dataset.u;if(i>0){[list[i-1],list[i]]=[list[i],list[i-1]];ui();}}if(x){list.splice(+x.dataset.x,1);ui();}};
$('add').onclick=()=>{list.push('🏃 새 운동');ui();};
['work','rest','sets'].forEach(id=>$(id).oninput=()=>{build();save();});
$('mv').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;move=+b.dataset.v;$('mv').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));build();};
const split=s=>{const m=s.match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)\s*(.*)$/u);return m?[m[1],m[2]||s]:['🏃',s];};
function build(){
  const W=Math.max(5,+$('work').value||30),Rt=Math.max(0,+$('rest').value||0),S=Math.max(1,+$('sets').value||1);
  steps=[{type:'ready',t:10,name:'준비하세요',emo:'🙌'}];
  for(let s=0;s<S;s++)list.forEach((x,i)=>{const [e,n]=split(x);steps.push({type:'work',t:W,name:n,emo:e,set:s+1,i});if(Rt&&!(s===S-1&&i===list.length-1))steps.push({type:'rest',t:Rt,name:move===0?'다음 정거장으로 이동!':'숨 고르기',emo:move===0?'👉':'💧',set:s+1,i});});
  const tot=steps.reduce((a,b)=>a+b.t,0);$('total').textContent=`모두 ${Math.floor(tot/60)}분 ${tot%60}초 · 운동 ${list.length}가지 × ${S}바퀴`;
  if(!run){idx=0;left=steps[0].t;show();}
}
const PC={ready:['#6366F1','준비','#312E81'],work:['#F472B6','운동!','#4A1036'],rest:['#22D3EE','쉬기','#083344']};
function show(){
  const s=steps[idx];if(!s)return;const [c,lab,glow]=PC[s.type];
  $('main').style.setProperty('--pc',c);$('main').style.setProperty('--glow',glow);
  $('phase').textContent=lab;$('emo').textContent=s.emo;$('ex').textContent=s.name;
  $('round').textContent=s.set?`${s.set}바퀴 · ${s.i+1}/${list.length}번째`:'';
  const nx=steps.slice(idx+1).find(x=>x.type==='work');$('next').innerHTML=nx?`다음: <b>${nx.emo} ${nx.name}</b>`:'마지막이에요! 힘내요 💪';
  draw();
}
function draw(){const s=steps[idx];const sec=Math.ceil(left);$('sec').textContent=sec;$('arc').style.strokeDashoffset=276.46*(1-left/s.t);}
function toggle(){run=!run;last=performance.now();$('go').textContent=run?'⏸ 멈춤':'▶ 다시';$('go').classList.toggle('pause',run);if(run)beep(660,.15);}
$('go').onclick=toggle;
function goto(i){idx=Math.max(0,Math.min(steps.length-1,i));left=steps[idx].t;lastBeep=-1;show();}
$('skip').onclick=()=>goto(idx+1);$('prev').onclick=()=>goto(idx-1);
$('stop').onclick=()=>{run=false;$('go').textContent='▶ 시작';$('go').classList.remove('pause');goto(0);};
$('done').onclick=()=>{$('done').classList.remove('on');$('stop').click();};
function tick(t){
  if(run){left-=(t-last)/1000;last=t;const s=Math.ceil(left);
    if(s<=3&&s>0&&s!==lastBeep){lastBeep=s;beep(880,.12,.18);$('sec').classList.remove('pulse');void $('sec').offsetWidth;$('sec').classList.add('pulse');}
    if(left<=0){if(idx>=steps.length-1){run=false;[0,180,360].forEach(d=>setTimeout(()=>beep(1046,.25,.2),d));$('done').classList.add('on');$('go').textContent='▶ 시작';$('go').classList.remove('pause');}
      else{goto(idx+1);beep(steps[idx].type==='work'?1320:520,.35,.25);}}
    draw();}
  requestAnimationFrame(tick);
}
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();toggle();}});
ui();requestAnimationFrame(tick);
})();
</script>
</body>
</html>

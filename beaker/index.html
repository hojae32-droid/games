<!doctype html>
<html lang="ko">
<head>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<meta charset="utf-8">
<meta name="theme-color" content="#0e7490">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>비커 받기 대작전 | 비춤이샘 수업용 게임</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=Gowun+Dodum&display=swap');
@font-face{font-family:'DH-fb';src:local('Noto Sans CJK KR Black'),local('Noto Sans KR Black'),local('Malgun Gothic Bold'),local('AppleSDGothicNeo-Heavy');}
:root{
 --disp:'Gothic A1','DH-fb','Noto Sans CJK KR','Malgun Gothic',sans-serif; --sans:'Gowun Dodum','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
 --page:#f4f8fb;
 --ink:#0f2a3d;
 --sub:#5b7a90;
 --focus:#ffb703;
 --bw:2px;
 --line:#0f2a3d;
 --rad:14px;
 --rad-s:10px;
 --card:#ffffff;
 --card-ink:#0f2a3d;
 --hl:#0891b2;
 --sh-card:0 8px 24px rgba(15,42,61,.16);
 --sh-btn:0 3px 0 #bcd2e0;
 --sh-btn-down:0 1px 0 #bcd2e0;
 --sh-go:0 6px 0 #0e7490;
 --btn-bg:#ffffff;
 --btn-ink:#0f2a3d;
 --stage:#e3eef6;
 --tag-bg:#0891b2;
 --tag-ink:#fff;
 --title:#fff;
 --title1:#cffafe;
 --title2:#fff;
 --lamp-r:50%;
 --lamp-bg:#f1f7fb;
 --lamp-ink:#0f2a3d;
 --lamp-on:#2fbf71;
 --bad:#e5383b;
 --chip-bg:#f1f7fb;
 --chip-ink:#0f2a3d;
 --chip-line:#bcd2e0;
 --chip-sub:#5b7a90;
 --sel-bg:#0891b2;
 --sel-ink:#fff;
 --sel-line:#0e7490;
 --sel-sub:#fff;
 --input-bg:#fff;
 --input-ink:#0f2a3d;
 --input-ph:#9aa;
 --go-bg:#f97316;
 --go-ink:#fff;
 --bar-bg:#0f2a3d;
 --bar-ink:#fff;
 --bar-sub:#ddd;
 --clock-bg:#fff;
 --clock-ring:#0891b2;
 --clock-track:#d3e4ef;
 --clock-ink:#0f2a3d;
 --arena:#0f2a3d;
 --gap:3px;
 --phead-ink:#fff;
 --no-r:6px;
 --sc-bg:#fff;
 --sc-ink:#0f2a3d;
 --sc-sub:#5b7a90;
 --sc-r:999px;
 --prog-bg:rgba(255,255,255,.25);
 --prog-fill:linear-gradient(90deg,#22d3ee,#f97316);
 --q-bg:rgba(255,255,255,.97);
 --q-ink:#0f2a3d;
 --q-hl:#0891b2;
 --q-sub:#5b7a90;
 --tip-bg:#fff;
 --tip-ink:#0f2a3d;
 --tip-hl:#0891b2;
 --tip-bad:#ffe3e0;
 --tip-good:#dcf7ea;
 --streak-bg:#0891b2;
 --streak-ink:#fff;
 --tools-bg:#0f2a3d;
 --tool-bg:#fff;
 --tool-ink:#0f2a3d;
 --tool-line:#0f2a3d;
 --tool-sel:#0891b2;
 --tool-sel-ink:#fff;
 --veil:rgba(15,42,61,.65);
 --num:#f97316;
 --done-bg:rgba(15,42,61,.935);
 --done-ink:#fff;
 --done-hl:#0891b2;
 --res-title:#0891b2;
 --pname-b:.9;
 --acc:#0891b2;
 --hud-bg:#0f2a3d;
 --wz-bg:#ffffff;
 --tools-fade:linear-gradient(transparent,rgba(0,0,0,.45));
}
:root{--p1:#0891b2;--p2:#f97316;--p3:#16a34a;--p4:#a855f7;}
/* ===== 공통 뼈대: 위치·크기·움직임만 담고, 색·테두리·그림자·글꼴은 변수로 받아요 ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:16px;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:var(--page)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3,.big,.jua{font-family:var(--disp);font-weight:400}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
img.emj{width:1.18em;height:1.18em;vertical-align:-.24em;display:inline-block;object-fit:contain;pointer-events:none}
svg.logo{display:block;width:100%;height:100%}

/* ---------- 설정 화면 ---------- */
#setup{overflow-y:auto;overflow-x:hidden}
.topbar-mini{position:fixed;top:12px;right:14px;display:flex;gap:8px;z-index:9}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 14px;border:var(--bw) solid var(--line);border-radius:var(--rad-s);
  background:var(--btn-bg);color:var(--btn-ink);font-family:var(--sans);font-weight:700;font-size:16px;white-space:nowrap;box-shadow:var(--sh-btn);transition:transform .08s,box-shadow .08s,background .12s}
.icon-btn:hover{filter:brightness(1.06)}
.icon-btn:active{transform:translateY(3px);box-shadow:var(--sh-btn-down)}
.icon-btn.ico{padding:0}
.booth{position:relative;overflow:hidden;background:var(--stage)}
.booth canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sign{position:absolute;text-align:center;pointer-events:none}
.sign .sub{display:inline-block;font:700 14px/1 var(--sans);padding:7px 15px;margin-bottom:10px;border-radius:999px;background:var(--tag-bg);color:var(--tag-ink);border:var(--bw) solid var(--line)}
.sign h1{margin:0;line-height:1.04;white-space:nowrap;font-size:clamp(38px,5vw,76px);color:var(--title)}
.sign h1 .l1{display:block;color:var(--title1)}
.sign h1 .l2{display:block;color:var(--title2)}
.booth-how{position:absolute;padding:11px 15px;font-size:clamp(12.5px,1.05vw,14.5px);line-height:1.65;word-break:keep-all;background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--sh-card)}
.booth-how b{color:var(--hl)}
.counter-col{padding:22px 18px 36px}
.form{width:min(780px,100%);margin:0 auto;counter-reset:stn}
.stn{position:relative;margin-top:14px;padding:14px 18px 16px;background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--sh-card);counter-increment:stn}
.stn-h{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.stn-h h2{margin:0;font-family:var(--sans);font-weight:700;font-size:19px;color:var(--card-ink)}
.lamp{flex:0 0 auto;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--lamp-r);background:var(--lamp-bg);color:var(--lamp-ink);border:var(--bw) solid var(--line);font:700 16px/1 var(--sans)}
.lamp::before{content:counter(stn)}
.stn.done .lamp{background:var(--lamp-on)}
.stn.done .lamp::before{content:'✓'}
.needmsg{display:none;font:700 12.5px/1 var(--sans);font-style:normal;color:#fff;background:var(--bad);border-radius:999px;padding:5px 11px}
.stn.need{animation:needshake .35s;outline:3px solid var(--bad);outline-offset:2px}
.stn.need .needmsg{display:inline-block}
@keyframes needshake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.chips{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.chips.lv{grid-template-columns:1fr 1fr}
.chips.md,.chips.tm{grid-template-columns:repeat(3,1fr)}
.grade-group .gl{font:700 13px var(--sans);color:var(--sub);margin:0 0 8px}
.chip{position:relative;display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;padding:8px 14px;border:var(--bw) solid var(--chip-line);border-radius:var(--rad-s);
  background:var(--chip-bg);color:var(--chip-ink);font-family:var(--sans);font-weight:700;font-size:16.5px;line-height:1.2;word-break:keep-all;box-shadow:var(--sh-btn);transition:transform .08s,box-shadow .08s,background .12s}
.chip>span{min-width:0}
.chip small{display:block;font:500 12.5px/1.35 var(--sans);color:var(--chip-sub);margin-top:3px}
.chip:hover{filter:brightness(1.05)}
.chip:active{transform:translateY(3px);box-shadow:var(--sh-btn-down)}
.chip.sel{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-line);transform:translateY(-1px)}
.chip.sel small{color:var(--sel-sub)}
.chip svg{flex:0 0 auto;width:36px;height:36px}
.chips.md .chip{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:10px 8px}
.chips.md .chip svg{width:32px;height:32px}
.chips.tm .chip{justify-content:center;text-align:center;white-space:nowrap}
.nick-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.nick-row .dot{flex:0 0 auto;width:14px;height:40px;border-radius:7px;border:var(--bw) solid var(--line)}
.nick-row input{flex:1;min-width:0;max-width:380px;font-family:var(--sans);font-weight:700;font-size:19px;padding:9px 14px;border-radius:var(--rad-s);border:var(--bw) solid var(--line);outline:none;background:var(--input-bg);color:var(--input-ink)}
.nick-row input::placeholder{color:var(--input-ph);font-weight:500}
.nick-row input:focus{box-shadow:0 0 0 4px var(--focus)}
.dice{flex:0 0 auto;width:50px;height:48px;border:var(--bw) solid var(--line);border-radius:var(--rad-s);background:var(--btn-bg);box-shadow:var(--sh-btn);font-size:24px;display:grid;place-items:center;transition:transform .15s}
.dice:active{transform:translateY(3px) rotate(25deg);box-shadow:var(--sh-btn-down)}
.dice img.emj{width:28px;height:28px;vertical-align:0}
.hint{color:var(--sub);font-size:14px;line-height:1.55;margin-top:8px;word-break:keep-all}
.hint b{color:var(--card-ink)}
.fire{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin:22px 0 0;padding:15px 20px;border:var(--bw) solid var(--line);border-radius:var(--rad);
  font-family:var(--disp);font-size:30px;color:var(--go-ink);background:var(--go-bg);box-shadow:var(--sh-go);transition:transform .08s,box-shadow .08s}
.fire svg{width:32px;height:32px}
.fire:hover{filter:brightness(1.06)}
.fire:active{transform:translateY(4px);box-shadow:var(--sh-btn-down)}
.maker{text-align:center;color:var(--sub);font-size:13px;margin-top:22px}
.nl-role{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.nl-chk{color:var(--card-ink)}
.nl-join b{color:var(--card-ink)}
.nl-role .chip{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}

/* ---------- 플레이 화면 ---------- */
.pbar{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:64px;background:var(--bar-bg);color:var(--bar-ink)}
.clock{--f:1;position:relative;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px 0 5px;border-radius:999px;background:var(--clock-bg);border:var(--bw) solid var(--line);flex:0 0 auto}
.clock .ring{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--clock-ring) calc(var(--f)*360deg),var(--clock-track) 0);border:2px solid var(--line);position:relative}
.clock .ring::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--clock-bg)}
.clock b{font-family:var(--disp);font-weight:400;font-size:27px;color:var(--clock-ink);letter-spacing:.02em;min-width:2.6em;font-variant-numeric:tabular-nums}
.clock.hurry{animation:hurry .9s infinite}
.clock.hurry b{color:var(--bad)}
@keyframes hurry{50%{transform:scale(1.06)}}
.ptitle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 4px}
.ptitle .pe{flex:0 0 auto;line-height:0;width:38px;height:38px}
.ptitle .pt{min-width:0;display:flex;align-items:baseline;gap:10px}
.ptitle .pt b{font-family:var(--disp);font-weight:400;font-size:25px;color:var(--bar-ink);white-space:nowrap}
.ptitle .pt small{font-size:14px;color:var(--bar-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.quit{padding:0 16px}
.arena{flex:1;display:flex;gap:var(--gap);padding:var(--gap);min-height:0;background:var(--arena)}
.arena.solo{padding:var(--gap) 12px}
.panel{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--rad);overflow:hidden;container-type:inline-size;container-name:panel;box-shadow:var(--sh-card)}
.arena.solo .panel{max-width:1100px;margin:0 auto}
.phead{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;min-height:44px;background:var(--phead-bg,var(--pc));color:var(--phead-ink)}
.phead .no{flex:0 0 auto;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--no-r);background:var(--pc);color:#fff;border:var(--bw) solid var(--line);font:700 17px/1 var(--sans)}
.phead .nm{font-family:var(--sans);font-weight:700;font-size:clamp(15px,4.8cqw,21px);color:var(--phead-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.phead .tm{display:none}
.phead .sc{font-family:var(--disp);font-size:clamp(18px,6cqw,26px);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--sc-ink);background:var(--sc-bg);border:var(--bw) solid var(--line);padding:4px 12px;border-radius:var(--sc-r)}
.phead .sc small{font-size:.55em;color:var(--sc-sub);margin-left:2px}
.phead .sc.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.2) rotate(-3deg)}}
.prog{height:10px;position:relative;background:var(--prog-bg)}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--prog-fill);transition:width .3s linear}
.stage{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.qbox.ask{position:relative;z-index:2;min-height:clamp(50px,11cqw,72px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:6px 14px 7px;background:var(--q-bg);color:var(--q-ink);font-family:var(--disp);font-size:clamp(16px,5.2cqw,29px);line-height:1.25;word-break:keep-all;transform-origin:50% 0}
.qbox.ask b{font-weight:400;color:var(--q-hl)}
.qbox.ask.flash{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:none;opacity:1}}
.qbox.ask .s{display:block;font:500 clamp(11px,3.3cqw,14px)/1.3 var(--sans);color:var(--q-sub);margin-top:2px}
.cvwrap{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;touch-action:none;background:var(--stage)}
.cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tip{position:absolute;left:50%;bottom:8px;z-index:6;width:max-content;max-width:calc(100% - 16px);background:var(--tip-bg);color:var(--tip-ink);border:var(--bw) solid var(--line);border-radius:var(--rad-s);padding:8px 14px;
  font:700 clamp(13px,3.9cqw,17px)/1.45 var(--sans);text-align:center;word-break:keep-all;pointer-events:none;opacity:0;transform:translate(-50%,12px);transition:.22s cubic-bezier(.2,1.4,.4,1);box-shadow:var(--sh-btn)}
.tip b{color:var(--tip-hl)}
.tip.on{opacity:1;transform:translate(-50%,0)}
.tip.bad{background:var(--tip-bad)}
.tip.good{background:var(--tip-good)}
.streak{position:absolute;top:10px;right:8px;z-index:4;font-family:var(--disp);font-size:clamp(14px,4.4cqw,19px);color:var(--streak-ink);background:var(--streak-bg);border:var(--bw) solid var(--line);border-radius:999px;padding:3px 12px;opacity:0;transform:scale(.6) rotate(-6deg);transition:.2s;pointer-events:none}
.streak.on{opacity:1;transform:rotate(-4deg)}
.ctrl.tools{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px;background:var(--tools-bg)}
.ctrl.tools:empty{display:none}
.toolbtn{font-family:var(--disp);font-size:clamp(14px,4.5cqw,21px);min-height:clamp(46px,12cqw,62px);flex:1 1 0;min-width:0;border-radius:var(--rad-s);border:var(--bw) solid var(--tool-line);background:var(--tool-bg);color:var(--tool-ink);
  box-shadow:var(--sh-btn);padding:4px 8px;line-height:1.15;word-break:keep-all;transition:transform .08s,box-shadow .08s,background .12s}
.toolbtn:hover{filter:brightness(1.05)}
.toolbtn:active{transform:translateY(3px);box-shadow:var(--sh-btn-down)}
.toolbtn.sel{background:var(--tool-sel);color:var(--tool-sel-ink)}
.toolbtn .e{display:block;font-size:1.3em;line-height:1.1;margin-bottom:1px}
.toolbtn .e img.emj{width:1.25em;height:1.25em;vertical-align:0}
.howcard{position:absolute;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--veil)}
.howcard .in{position:relative;background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:26px 22px 18px;max-width:440px;width:100%;text-align:center;box-shadow:var(--sh-card);overflow:hidden}
.howcard .e{width:clamp(44px,13cqw,68px);height:clamp(44px,13cqw,68px);margin:0 auto;line-height:0}
.howcard .t{font-family:var(--disp);font-size:clamp(20px,6.4cqw,30px);color:var(--card-ink);margin-top:6px}
.howcard .d{font-size:clamp(13px,4cqw,17px);line-height:1.6;margin-top:6px;color:var(--sub);word-break:keep-all}
.howcard .d b{color:var(--hl)}
.howcard .num{font-family:var(--disp);font-size:clamp(48px,18cqw,100px);line-height:1;margin-top:10px;color:var(--num)}
.howcard .num.go{animation:cd .9s ease-out}
@keyframes cd{0%{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}}
.done-cover{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;background:var(--done-bg);color:var(--done-ink)}
.done-cover.on{display:flex;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.done-cover .big{font-size:clamp(28px,10cqw,50px);color:var(--done-hl)}
.done-cover .s2{font-size:clamp(14px,4.6cqw,20px);opacity:.85}
.done-cover .sc2{font-family:var(--disp);font-size:clamp(18px,6cqw,26px)}
.done-cover .sc2 b{font-weight:400;font-size:2.2em;color:var(--done-hl);margin-right:4px}

/* ---------- 결과 화면 ---------- */
#result{overflow-y:auto;align-items:center;padding:30px 16px 40px}
.res-wrap{width:min(1000px,100%)}
.res-title{text-align:center;font-family:var(--disp);font-size:clamp(34px,5.2vw,58px);color:var(--res-title);margin:4px 0 8px}
.room-note{text-align:center;color:var(--card-ink);background:var(--card);border:var(--bw) solid var(--line);border-radius:999px;padding:8px 18px;margin:0 auto 18px;max-width:600px;font-size:15px}
.room-note b{color:var(--hl)}
.podium{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-end}
.pcard{position:relative;flex:1 1 200px;max-width:280px;background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:22px 14px 16px;text-align:center;box-shadow:var(--sh-card);overflow:hidden}
.pcard::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;background:var(--pc)}
.pcard .rk{font-size:46px;line-height:1.1}
.pcard .rk img.emj{width:58px;height:58px;vertical-align:0}
.pcard .nm{font-family:var(--sans);font-weight:700;font-size:22px;color:var(--pc);margin-top:4px;filter:brightness(var(--pname-b,1))}
.pcard .pts{font-family:var(--disp);font-size:44px;color:var(--card-ink);line-height:1.15}
.pcard .st{color:var(--sub);font-size:14px}
.review{background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--line);border-radius:var(--rad);padding:16px 20px;margin-top:18px;box-shadow:var(--sh-card);line-height:1.6}
.review h3{margin:0 0 8px;font-size:22px;color:var(--card-ink)}
.review details{margin:6px 0}
.review summary{font-family:var(--sans);font-weight:700;font-size:17px;cursor:pointer}
.review ul{padding-left:20px;margin:6px 0}
.review li{margin:5px 0}
.review li b{color:var(--hl)}
.res-btns{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.res-btns button{font-family:var(--disp);font-size:22px;padding:13px 32px;border:var(--bw) solid var(--line);border-radius:var(--rad);color:var(--go-ink);background:var(--go-bg);box-shadow:var(--sh-go)}

/* ---------- 각자 기기 대결 ---------- */
body .nl-card{background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--sh-card)}

body .nl-card h2{font-family:var(--disp);color:var(--card-ink)}

body .nl-code{font-family:var(--disp);border:3px dashed var(--line);background:var(--input-bg);color:var(--hl);border-radius:var(--rad)}
body .nl-set,body .nl-hint{color:var(--sub)}
body .nl-p{font-family:var(--sans);font-weight:700;border:var(--bw) solid var(--line);background:var(--chip-bg);color:var(--chip-ink);border-radius:var(--rad-s)}
body .nl-p.me{background:var(--sel-bg);color:var(--sel-ink)}
body .nl-p.empty{opacity:.5;border-style:dashed}
body .nl-p .bd{font-weight:500;color:var(--sub)}
body .nl-p .bar{background:var(--prog-bg);border:2px solid var(--line)}
body .nl-btns button{font-family:var(--disp);border:var(--bw) solid var(--line);border-radius:var(--rad-s);color:var(--go-ink);background:var(--go-bg);box-shadow:var(--sh-go)}
body .nl-btns button.sub{background:var(--btn-bg);color:var(--btn-ink);box-shadow:var(--sh-btn)}
body .nl-join input,body .room input{font-family:var(--sans);font-weight:700;border:var(--bw) solid var(--line);border-radius:var(--rad-s);background:var(--input-bg);color:var(--input-ink)}
body .nl-join input:focus{outline:none;box-shadow:0 0 0 4px var(--focus)}
body .nl-chk input{accent-color:var(--acc)}
body .netstrip{background:var(--tools-bg);border-bottom:var(--bw) solid var(--line)}
body .netstrip .ch{font-family:var(--sans);font-weight:700;background:var(--chip-bg);color:var(--chip-ink);border:2px solid var(--line)}
body .netstrip .ch.me{background:var(--sel-bg);color:var(--sel-ink)}
body .netstrip .lb{color:var(--sub)}
body .netstrip .endall{background:transparent;color:var(--bad);border-color:var(--bad)}

/* ---------- 첫 화면 배치(body 클래스로 고름) ---------- */
/* 위쪽 그림 + 아래 설정 */
body.L-banner #setup{flex-direction:column}
body.L-banner .booth{flex:0 0 auto;width:100%;height:clamp(310px,46vh,440px);border-bottom:var(--bw) solid var(--line)}
body.L-banner .sign{right:clamp(16px,6%,90px);top:clamp(16px,6vh,44px);transform:rotate(-2deg)}
body.L-banner .booth-how{right:clamp(16px,6%,90px);bottom:14px;width:min(46%,520px)}
body.L-banner .counter-col{flex:0 0 auto;width:100%}
/* 왼쪽 그림 + 오른쪽 설정 */
body.L-split #setup,body.L-splitR #setup{flex-direction:row;overflow:hidden}
body.L-splitR #setup{flex-direction:row-reverse}
body.L-split .booth,body.L-splitR .booth{flex:0 0 46%;height:100%}
body.L-split .counter-col,body.L-splitR .counter-col{flex:1;min-width:0;height:100%;overflow-y:auto;padding:24px clamp(16px,3.4vw,44px) 30px}
body.L-split .sign,body.L-splitR .sign{left:50%;top:clamp(14px,4vh,36px);transform:translateX(-50%);white-space:nowrap}
body.L-split .sign h1,body.L-splitR .sign h1{font-size:clamp(34px,3.7vw,66px)}
body.L-split .booth-how,body.L-splitR .booth-how{left:5%;right:5%;bottom:clamp(14px,3vh,28px)}
/* 전체 그림 위에 유리 카드 */
body.L-center #setup{flex-direction:column}
body.L-center .booth{position:fixed;inset:0;height:auto}
body.L-center .sign{left:50%;top:clamp(12px,3.5vh,34px);transform:translateX(-50%)}
body.L-center .booth-how{display:none}
body.L-center .counter-col{position:relative;z-index:2;flex:0 0 auto;width:100%;padding-top:clamp(190px,32vh,290px)}

/* 가운데 열 + 둥근 그림 창 */
body.L-stack #setup{flex-direction:column;align-items:center}
body.L-stack .booth{flex:0 0 auto;width:min(860px,calc(100% - 28px));height:clamp(240px,38vh,340px);margin:16px auto 0;border:var(--bw) solid var(--line);border-radius:var(--rad);box-shadow:var(--sh-card)}
body.L-stack .sign{left:50%;top:clamp(12px,4vh,30px);transform:translateX(-50%)}
body.L-stack .booth-how{position:static;display:block;width:min(860px,calc(100% - 28px));margin:14px auto 0}
body.L-stack .counter-col{flex:0 0 auto;width:100%;padding-top:4px}

@media (max-width:860px){

}

}

}
.ctrl.tools:has(.toolbtn:nth-child(4)){display:grid;grid-template-columns:1fr 1fr}
.ctrl.tools:has(.toolbtn:nth-child(4)) .toolbtn{min-height:44px}
/* ===== 전체 화면형 게임 화면 + 한 화면 설정(단계별) + 탭 결과 — body.G-full 일 때만 적용 ===== */
body.G-full{overscroll-behavior:none}
body.G-full .screen{height:100dvh;bottom:auto}
/* ---------- 설정: 스크롤 없이 단계별로 ---------- */
body.G-full #setup{overflow:hidden}
body.G-full .topbar-mini{top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
body.G-full .topbar-mini .icon-btn{height:40px;min-width:40px;padding:0 10px}
body.G-full .counter-col{min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(8px,2.2dvh,22px) clamp(10px,2.4vw,34px)}

.wz-steps{flex:0 0 auto;display:flex;gap:6px;margin-bottom:clamp(6px,1.4dvh,12px)}
.wz-dot{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:clamp(32px,5.2dvh,42px);border:var(--bw) solid var(--chip-line);border-radius:999px;background:var(--chip-bg);color:var(--chip-sub);font:700 clamp(12px,1.9dvh,14.5px)/1 var(--sans);box-shadow:none}
.wz-dot i{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--lamp-bg);color:var(--lamp-ink);font-style:normal;font-size:.95em}
.wz-dot.on{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-line)}
.wz-dot.on i{background:#fff;color:var(--sel-bg)}
.wz-dot.past i{background:var(--lamp-on);color:#fff}
body.G-full .wz-body{flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0;width:100%;scrollbar-width:none}
body.G-full .wz-body::-webkit-scrollbar{display:none}
.wz-step{display:flex;flex-direction:column;gap:clamp(5px,1.1dvh,10px)}
body.G-full .stn{margin:0;padding:clamp(6px,1.2dvh,12px) clamp(10px,1.6vw,16px) clamp(7px,1.3dvh,13px)}

body.G-full .stn-h h2{font-size:clamp(15px,2.3dvh,19px)}
body.G-full .lamp{width:clamp(22px,3.3dvh,30px);height:clamp(22px,3.3dvh,30px);font-size:clamp(12px,1.9dvh,15px)}
body.G-full .stn.opt .lamp::before{content:'★'}
body.G-full .chips{gap:clamp(6px,1.2dvh,10px)}
body.G-full .chip{min-height:clamp(36px,5.7dvh,52px);padding:6px 12px;font-size:clamp(14.5px,2.35dvh,17px)}
body.G-full .chip small{font-size:clamp(11px,1.65dvh,12.5px);margin-top:2px}
body.G-full .chips.lv{grid-template-columns:1fr 1fr}
body.G-full .chips.lv:has(.chip:nth-child(odd):last-child){grid-template-columns:1fr 1fr}

body.G-full .chips.md .chip svg{width:clamp(24px,4.4dvh,32px);height:clamp(24px,4.4dvh,32px)}

body.G-full .nick-row .dot{height:clamp(34px,5.4dvh,40px)}
body.G-full .nick-row input{font-size:clamp(15px,2.4dvh,19px);padding:clamp(6px,1.1dvh,9px) 12px;max-width:none}
body.G-full .dice{height:clamp(38px,5.8dvh,48px);width:clamp(42px,6dvh,50px)}
body.G-full .hint{font-size:clamp(12px,1.7dvh,14px);margin-top:4px;line-height:1.45}
.wz-nav{flex:0 0 auto;display:flex;gap:10px;margin-top:clamp(8px,1.6dvh,14px);align-items:stretch}
.wz-prev,.wz-next{border:var(--bw) solid var(--line);border-radius:var(--rad);background:var(--btn-bg);color:var(--btn-ink);box-shadow:var(--sh-btn);font:700 clamp(15px,2.4dvh,18px)/1 var(--sans);padding:0 clamp(14px,2vw,22px);min-height:clamp(44px,7dvh,56px)}
.wz-next{flex:1;background:var(--go-bg);color:var(--go-ink);box-shadow:var(--sh-go);font-family:var(--disp);font-size:clamp(18px,3dvh,24px)}
.wz-prev:active,.wz-next:active{transform:translateY(3px);box-shadow:var(--sh-btn-down)}
body.G-full .wz-nav .fire{margin:0;flex:1;padding:6px 14px;min-height:clamp(46px,7.4dvh,60px);font-size:clamp(20px,3.4dvh,29px);gap:9px}
body.G-full .fire svg{width:clamp(20px,3.2dvh,28px);height:clamp(20px,3.2dvh,28px)}
body.G-full .wz .maker{margin-top:clamp(4px,1dvh,10px);font-size:12px;flex:0 0 auto}
body.G-full .sign{pointer-events:none}
body.G-full .sign .sub{font-size:clamp(11px,1.8dvh,14px);padding:clamp(4px,.8dvh,7px) 13px;margin-bottom:clamp(4px,1dvh,10px)}
body.G-full .booth-how{display:none}
/* ----- 배치 ----- */
body.G-full.L-wsplit #setup,body.G-full.L-wsplitR #setup{flex-direction:row}
body.G-full.L-wsplitR #setup{flex-direction:row-reverse}
body.G-full.L-wsplit .booth,body.G-full.L-wsplitR .booth{flex:0 0 44%;height:100%}

body.G-full.L-wsplit .sign,body.G-full.L-wsplitR .sign{left:50%;top:clamp(18px,7dvh,70px);transform:translateX(-50%);white-space:nowrap}
body.G-full.L-wsplit .sign h1,body.G-full.L-wsplitR .sign h1{font-size:clamp(34px,min(4.4vw,9dvh),74px)}
body.G-full.L-wtop #setup{flex-direction:column}

body.G-full.L-wcenter .wz-body,body.G-full.L-wfloat .wz-body{flex:0 1 auto}

body.G-full.L-wcenter .sign h1{font-size:clamp(28px,min(5vw,6.6dvh),60px)}
body.G-full.L-wcenter .counter-col{padding-top:clamp(100px,21.5dvh,200px)}
body.G-full.L-wfloat .counter-col{justify-content:flex-end;padding-right:clamp(14px,4vw,64px)}
body.G-full.L-wfloat .wz{width:min(500px,48vw)}
body.G-full.L-wfloat .sign{left:clamp(20px,5vw,84px);top:50%;transform:translateY(-50%);text-align:left;white-space:nowrap}
body.G-full.L-wfloat .sign h1{font-size:clamp(34px,min(5.6vw,11dvh),88px)}
/* 세로(폰·태블릿 세로) 또는 폭 좁은 화면: 위에 그림, 아래 설정 */

<script>
/* 비춤이샘 과학 게임 공통 틀 (실시간 액션형) — 수학 게임 공통 틀을 바탕으로 '게임 시간' 방식으로 바꿈 */
(function(){
'use strict';
const FULL=document.body.classList.contains('G-full');
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const PCOL=['var(--p1)','var(--p2)','var(--p3)','var(--p4)'];
const PHEX=["#0891b2", "#f97316", "#16a34a", "#a855f7"];

/* ---------- 난수 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeR(seed){
  const f=mulberry32(seed);
  const R={f,
    int:(a,b)=>a+Math.floor(f()*(b-a+1)),
    num:(a,b)=>a+f()*(b-a),
    pick:a=>a[Math.floor(f()*a.length)],
    chance:p=>f()<p,
    shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
    sample:(a,k)=>R.shuffle(a).slice(0,k),
    sign:()=>f()<.5?-1:1,
  };
  return R;
}

/* ---------- 소리: 부드러운 실로폰·마림바 느낌 ---------- */
function lsGet(k,d){try{const v=localStorage.getItem('bcs_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem('bcs_'+k,JSON.stringify(v));}catch(e){}}
const Snd={on:lsGet('sound',true),ac:null,out:null,
  ctx(){if(!this.ac){try{const ac=new (window.AudioContext||window.webkitAudioContext)();

      const comp=ac.createDynamicsCompressor();const mg=ac.createGain();mg.gain.value=.7;
      lp.connect(comp);comp.connect(mg);mg.connect(ac.destination);this.ac=ac;this.out=lp;}catch(e){}}
    if(this.ac&&this.ac.state==='suspended')this.ac.resume();return this.ac;},
  tone(freq,dur=.12,type='sine',vol=.1,when=0){if(!this.on)return;const ac=this.ctx();if(!ac)return;const t=ac.currentTime+when;
    const o=ac.createOscillator(),g=ac.createGain();o.type=(type==='square'||type==='sawtooth')?'triangle':type;o.frequency.setValueAtTime(freq,t);
    const v=Math.min(vol,.12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0005,t+Math.max(.06,dur));

  isGuestSetup(cfg){return cfg.mode==='device'&&cfg.netRole==='join';},
  isWatchSetup(cfg){return cfg.mode==='device'&&cfg.netRole==='host'&&cfg.watch;},
  say(t,ok){if(this.msgEl){this.msgEl.className='nl-msg'+(ok?' ok':'');this.msgEl.textContent=t;}},

  /* 설정 화면에서 '시작'을 눌렀을 때 */
  async go(cfg){
    const E=this.E;
    if(!window.RTCPeerConnection){this.say('이 화면에서는 온라인 연결을 쓸 수 없어요. 게임을 올린 인터넷 주소(예: Vercel)에서 열어 주세요.');return;}
    // 이미 방장으로 방을 열어 둔 상태에서 설정만 바꾼 경우 → 대기실로
    if(this.on&&this.role==='host'&&this.peer&&!this.peer.destroyed&&cfg.netRole==='host'){this.set=this.pickSet(cfg);this.setWatch(cfg.watch,cfg.nicks[0]);this.bcast({t:'lobby',roster:this.roster,set:this.set});this.showLobby();return;}
    this.leave(true);
    this.say('연결하는 중…',true);
    try{await this.load();}catch(e){this.say('연결 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');return;}
    if(cfg.netRole==='host')this.host(cfg);else this.join(cfg);
  },
  pickSet(cfg){return{level:cfg.level,count:cfg.count,dur:cfg.dur,pace:cfg.pace};},
  setWatch(w,nick){this.watch=!!w;const me=this.roster.find(p=>p.id==='host');
    if(this.watch&&me)this.roster=this.roster.filter(p=>p!==me);
    if(!this.watch){if(me)me.nick=nick;else this.roster.unshift(this.entry('host',nick));}
    this.myId=this.watch?null:'host';},
  entry(id,nick){const used=this.roster.map(p=>p.ci);let ci=0;while(used.includes(ci))ci++;return{id,nick,ci,score:0,prog:0,done:false,left:false,k2:0,k3:0,line:'',seen:Date.now()};},

  host(cfg){
    let tries=0;
    const tryHost=k=>{const code=String(1000+Math.floor(Math.random()*9000));
      const peer=new Peer(this.prefix()+code,this.opts());let opened=false,dead=false,ot=0;
      const retry=why=>{if(dead)return;dead=true;clearTimeout(ot);try{peer.destroy();}catch(e){}
        if(why==='id'&&k<8){tryHost(k+1);return;}
        if(why!=='id'&&++tries<=3){this.say('연결하는 중… ('+(tries+1)+'번째 시도)',true);setTimeout(()=>tryHost(0),1200*tries);return;}
        this.say('방을 만들지 못했어요. 잠시 뒤에 다시 눌러 주세요. (오류: '+(this.lastErr||'시간 초과')+')');};
      ot=setTimeout(()=>{if(!opened)retry('net');},12000);
      peer.on('open',()=>{if(dead)return;opened=true;clearTimeout(ot);Object.assign(this,{on:true,role:'host',peer,code,conns:[],roster:[],started:false,final:false,gone:false,set:this.pickSet(cfg)});
        this.setWatch(cfg.watch,cfg.nicks[0]);
        this.every(3000,()=>{this.bcast({t:'hb'});const now=Date.now();this.roster.forEach(p=>{if(p.id!=='host'&&!p.left&&now-p.seen>30000)this.drop(p.id);});});
        this.say('');this.showLobby();});
      peer.on('connection',c=>this.hostConn(c));
      peer.on('error',err=>{this.lastErr=err.type;if(!opened){retry(err.type==='unavailable-id'?'id':'net');return;}
        if(['network','server-error','socket-error','socket-closed'].includes(err.type)){try{if(!peer.destroyed)peer.reconnect();}catch(e){}}});
      peer.on('disconnected',()=>{try{if(!peer.destroyed)peer.reconnect();}catch(e){}});};
    tryHost(0);
  },
  hostConn(conn){
    conn.on('data',msg=>{if(!msg||!this.on)return;const p=this.roster.find(x=>x.id===conn.peer);if(p)p.seen=Date.now();
      if(msg.t==='hello'){
        if(this.started&&!this.final){conn.send({t:'deny',why:'이미 게임이 시작됐어요. 끝난 뒤에 다시 들어와 주세요.'});setTimeout(()=>conn.close(),400);return;}
        if(this.roster.filter(x=>!x.left).length>=MAX){conn.send({t:'deny',why:`방이 가득 찼어요 (최대 ${MAX}명).`});setTimeout(()=>conn.close(),400);return;}
        let nick=String(msg.nick||'친구').slice(0,10);if(this.roster.some(x=>x.nick===nick))nick=nick+'2';
        this.roster=this.roster.filter(x=>!x.left);
        this.roster.push(this.entry(conn.peer,nick));this.conns.push(conn);
        conn.send({t:'welcome',you:conn.peer,code:this.code,roster:this.roster,set:this.set});
        this.bcast({t:'lobby',roster:this.roster,set:this.set});this.showLobby();Snd.tone(660,.08,'sine',.05);return;}
      if(msg.t==='sc'&&p){Object.assign(p,{score:msg.score,prog:msg.prog,done:msg.done,k2:msg.k2,k3:msg.k3,line:msg.line});this.boardSync();this.checkDone();return;}
      if(msg.t==='bye'){this.drop(conn.peer);}});
    conn.on('close',()=>{if(this.on&&this.role==='host')this.drop(conn.peer);});
  },
  drop(id){const p=this.roster.find(x=>x.id===id);this.conns.filter(c=>c.peer===id).forEach(c=>{try{c.close();}catch(e){}});this.conns=this.conns.filter(c=>c.peer!==id);
    if(!p||p.left)return;p.left=true;
    if(!this.started||this.final){this.roster=this.roster.filter(x=>x!==p);this.bcast({t:'lobby',roster:this.roster,set:this.set});if($('#lobby').classList.contains('on'))this.showLobby();}
    else{this.boardSync();this.checkDone();}},
  bcast(m){if(this.role!=='host')return;this.conns.forEach(c=>{try{if(c.open)c.send(m);}catch(e){}});},

  join(cfg){
    const code=cfg.joinCode;let done=false,tries=0,peer=null,tm=0;
    const fail=t=>{if(done)return;done=true;clearTimeout(tm);try{peer&&peer.destroy();}catch(e){}this.on=false;this.say(t);};
    Object.assign(this,{role:'guest',peer:null,code,roster:[],myId:null,watch:false,started:false,final:false,gone:false,myNick:cfg.nicks[0]});
    const attempt=()=>{if(done)return;clearTimeout(tm);try{peer&&peer.destroy();}catch(e){}
      const pr=new Peer(undefined,this.opts());peer=pr;this.peer=pr;
      const again=msg=>{if(done||pr!==peer)return;if(++tries<=3){this.say('연결하는 중… ('+(tries+1)+'번째 시도)',true);try{pr.destroy();}catch(e){}clearTimeout(tm);setTimeout(attempt,1000*tries);}else fail(msg);};
      tm=setTimeout(()=>again('방을 찾지 못했어요. 방 코드를 확인하고, 방장 화면이 켜져 있는지 봐 주세요.'),12000);
      pr.on('open',()=>{if(pr!==peer)return;const conn=pr.connect(this.prefix()+code,{reliable:true});this.conn=conn;
        conn.on('open',()=>conn.send({t:'hello',nick:cfg.nicks[0]}));
        conn.on('data',msg=>{if(!msg)return;this.lastHost=Date.now();
          if(msg.t==='deny'){fail(msg.why);return;}
          if(msg.t==='welcome'){done=true;clearTimeout(tm);this.on=true;this.myId=msg.you;this.roster=msg.roster;this.set=msg.set;this.say('');this.showLobby();
            this.every(3000,()=>{try{conn.send({t:'hb'});}catch(e){}if(Date.now()-this.lastHost>30000)this.hostLost();});return;}
          if(msg.t==='lobby'){this.roster=msg.roster;this.set=msg.set;if(!this.started||this.final){this.started=false;this.showLobby();}return;}
          if(msg.t==='start'){this.begin(msg);return;}
          if(msg.t==='board'){this.mergeBoard(msg.roster);this.renderLive();return;}
          if(msg.t==='final'){this.roster=msg.roster;this.finalize();return;}
          if(msg.t==='close'){this.hostLost(true);}});
        conn.on('close',()=>{if(this.on&&this.role==='guest')this.hostLost();});});
      pr.on('error',err=>{if(done||pr!==peer)return;if(err.type==='peer-unavailable')again('그 방 코드는 없어요. 방 코드를 다시 확인해 주세요.');else again('연결하지 못했어요. 잠시 뒤에 다시 눌러 주세요. (오류: '+err.type+')');});};
    attempt();
  },
  mergeBoard(r){const mine=this.me();this.roster=r;if(mine){const m=this.me();if(m)Object.assign(m,{score:mine.score,prog:mine.prog,done:mine.done,k2:mine.k2,k3:mine.k3,line:mine.line});}},
  hostLost(closed){if(this.gone||!this.on)return;this.gone=true;
    const lobbyOn=$('#lobby').classList.contains('on');
    if(lobbyOn||!this.started){alert(closed?'방장이 방을 닫았어요.':'방장과 연결이 끊어졌어요.');this.leave();this.E.show('setup');return;}
    this.banner('⚠️ 방장과 연결이 끊어졌어요. 내 게임은 끝까지 할 수 있어요.');
    const me=this.me();if(me&&me.done&&!this.final)this.finalize();},
  banner(t){const s=$('.netstrip');if(s){const b=h('span','lb',t);b.style.color='var(--bad)';s.appendChild(b);}},
  every(ms,fn){const t=setInterval(fn,ms);this.timers.push(t);},
  me(){return this.roster.find(p=>p.id===this.myId);},

  /* ---------- 대기실 ---------- */
  setText(){const E=this.E,s=this.set||{};const L=E.G.levels.find(l=>l.id===s.level);
    return (L?`${L.g} · ${L.t}`:'')+(s.count?` · ${s.count}문제`:'')+(s.dur?` · ${s.dur%60?Math.floor(s.dur/60)+'분 '+s.dur%60+'초':s.dur/60+'분'}`:'');},
  showLobby(){const E=this.E,S=$('#lobby');S.innerHTML='';const host=this.role==='host';
    const W=h('div','nl-wrap');S.appendChild(W);const C=h('div','nl-card');W.appendChild(C);
    C.innerHTML=`<span class="nl-tag">${host?(this.watch?'🏠 방장 · 진행만':'🏠 방장'):'🚪 참가자'}</span><h2>${E.G.emoji} ${esc(E.G.title)} 대기실</h2>
      <div class="nl-hint">친구들에게 이 방 코드를 알려 주세요</div><div class="nl-code">${this.code}</div><div class="nl-set">${this.setText()}</div>`;
    const list=h('div','nl-list');C.appendChild(list);
    const ps=this.roster.filter(p=>!p.left);
    ps.forEach(p=>{list.appendChild(h('div','nl-p'+(p.id===this.myId?' me':''),`<span class="dot" style="background:${PHEX[p.ci]}"></span><span class="nm">${esc(p.nick)}</span><span class="bd">${p.id==='host'?'방장':''}${p.id===this.myId?' (나)':''}</span>`));});
    for(let k=ps.length;k<MAX;k++)list.appendChild(h('div','nl-p empty','<span class="dot" style="background:#e5e7eb"></span><span class="nm">기다리는 중…</span>'));
    C.appendChild(h('div','nl-hint',`들어온 사람 <b>${ps.length}</b> / ${MAX}명`));
    const bt=h('div','nl-btns');C.appendChild(bt);
    const leave=h('button','sub','나가기');leave.onclick=()=>{if(confirm(host?'방을 닫을까요? 친구들도 나가게 돼요.':'방에서 나갈까요?')){this.leave();E.show('setup');}};
    if(host){const ch=h('button','sub','⚙️ 설정 바꾸기');ch.onclick=()=>E.show('setup');
      const need=this.watch?1:2;const go=h('button','',`게임 시작! (${ps.length}명)`);go.disabled=ps.length<need;go.onclick=()=>this.hostStart();
      bt.append(leave,ch,go);
      if(ps.length<need)C.appendChild(h('div','nl-hint',this.watch?'한 명 이상 들어오면 시작할 수 있어요.':'친구가 한 명 이상 들어오면 시작할 수 있어요.'));}
    else{bt.append(leave);C.appendChild(h('div','nl-hint','⏳ 방장이 시작하기를 기다리고 있어요…'));}
    E.show('lobby');},

  /* ---------- 시작 ---------- */
  hostStart(){const seed=Math.floor(Math.random()*1e9);this.roster=this.roster.filter(p=>!p.left);
    const msg={t:'start',seed,set:this.set,roster:this.roster.map(p=>Object.assign({},p,{score:0,prog:0,done:false,k2:0,k3:0,line:''}))};
    this.bcast(msg);this.begin(msg);},
  begin(msg){const E=this.E;this.seed=msg.seed;this.set=msg.set;this.roster=msg.roster;this.started=true;this.final=false;
    clearTimeout(this.forceT);
    const c=E.cfg;c.mode='device';c.level=msg.set.level;if(msg.set.count)c.count=msg.set.count;if(msg.set.dur)c.dur=msg.set.dur;if(msg.set.pace)c.pace=msg.set.pace;
    E.level=E.G.levels.find(l=>l.id===c.level);
    if(this.role==='host'&&this.watch){this.showBoard();if(msg.set.dur)this.forceT=setTimeout(()=>this.forceFinal(),(msg.set.dur+12)*1000);return;}
    c.nicks=[this.me()?this.me().nick:c.nicks[0]];
    E.start();},
  /* 플레이 화면 위쪽 실시간 점수 줄 */
  mountStrip(P){const s=h('div','netstrip');const bar=P.querySelector('.pbar');bar.after(s);this.renderLive();},
  sorted(){return this.roster.slice().sort((a,b)=>(a.left-b.left)||b.score-a.score||b.k2-a.k2||a.k3-b.k3);},
  renderLive(){const s=$('.netstrip');if(s){s.innerHTML=`<span class="lb">📡 방 ${this.code}</span>`;
      this.sorted().forEach((p,i)=>{s.appendChild(h('span','ch'+(p.id===this.myId?' me':'')+(p.done?' done':'')+(p.left?' left':''),`${p.left?'':(i+1)+'위'} <span class="dot" style="background:${PHEX[p.ci]}"></span>${esc(p.nick)} ${p.score}점${p.done?' ✅':''}`));});
      if(this.role==='host'&&!this.final){const b=h('button','endall','⏹ 모두 끝내기');b.onclick=()=>{if(confirm('지금 점수로 게임을 끝낼까요?'))this.forceFinal();};s.appendChild(b);}}
    if($('#netboard').classList.contains('on'))this.showBoard();},
  /* 진행만 하는 방장: 전자칠판 점수판 */
  showBoard(){const E=this.E,S=$('#netboard');S.innerHTML='';
    const W=h('div','nl-wrap');S.appendChild(W);const C=h('div','nl-card');W.appendChild(C);
    C.innerHTML=`<span class="nl-tag">📺 실시간 점수판</span><h2>${E.G.emoji} ${esc(E.G.title)}</h2><div class="nl-set">방 ${this.code} · ${this.setText()}</div>`;
    const list=h('div','nl-list');C.appendChild(list);
    this.sorted().forEach((p,i)=>{list.appendChild(h('div','nl-p'+(p.left?' left':''),`<span class="rk">${p.left?'🚪':p.done?'✅':(i+1)}</span><span class="dot" style="background:${PHEX[p.ci]}"></span><span class="nm">${esc(p.nick)}</span><span class="bar"><i style="width:${Math.round((p.prog||0)*100)}%;background:${PHEX[p.ci]}"></i></span><span class="pt">${p.score}점</span>`));});
    const bt=h('div','nl-btns');const end=h('button','sub','⏹ 지금 끝내기');end.onclick=()=>{if(confirm('지금 점수로 게임을 끝낼까요?'))this.forceFinal();};bt.appendChild(end);C.appendChild(bt);
    C.appendChild(h('div','nl-hint','모두 끝나면 자동으로 등수가 나와요.'));
    E.show('netboard');},

  /* ---------- 점수 보내기 ---------- */
  report(st){if(!this.on||!this.started)return;const me=this.me();if(!me)return;
    Object.assign(me,st);
    if(this.role==='host'){this.boardSync();this.checkDone();}
    else{try{this.conn&&this.conn.open&&this.conn.send(Object.assign({t:'sc'},st));}catch(e){}this.renderLive();
      if(st.done&&this.gone&&!this.final)this.finalize();}},
  boardSync(){this.bcast({t:'board',roster:this.roster});this.renderLive();},
  checkDone(){if(this.role!=='host'||this.final||!this.started)return;
    const act=this.roster.filter(p=>!p.left);if(act.length&&act.every(p=>p.done)){this.forceFinal();}},
  forceFinal(){if(this.role!=='host'||this.final)return;clearTimeout(this.forceT);this.bcast({t:'final',roster:this.roster});this.finalize();},
  finalize(){if(this.final)return;this.final=true;this.started=false;const E=this.E;
    E.stopAll&&E.stopAll();setTimeout(()=>E.results(),300);},

  /* ---------- 결과 화면 (모두의 등수) ---------- */
  results(W,unit){const E=this.E;const ps=this.sorted().filter(p=>!p.left);const gone=this.roster.filter(p=>p.left);
    const same=(a,b)=>a.score===b.score&&a.k2===b.k2&&a.k3===b.k3;ps.forEach((p,k)=>{p.rank=k&&same(p,ps[k-1])?ps[k-1].rank:k;});
    const tops=ps.filter(p=>p.rank===0);const me=this.me();
    W.appendChild(h('div','res-title',ps.length?(tops.length>1?`🏆 공동 1등! ${tops.map(p=>esc(p.nick)).join(', ')}`:`🏆 ${esc(ps[0].nick)} 승리!`):'게임 끝!'));
    if(me&&ps.length>1)W.appendChild(h('div','room-note',`나는 <b class="jua" style="font-size:24px">${me.rank+1}등</b>! · 방 ${this.code} · ${this.setText()}`));
    else W.appendChild(h('div','room-note',`방 ${this.code} · ${this.setText()}`));
    const pod=h('div','podium');W.appendChild(pod);
    ps.forEach(p=>{const c=h('div','pcard'+(p.id===this.myId?' nl-me':''));c.style.setProperty('--pc',PHEX[p.ci]);
      c.innerHTML=`<div class="rk">${ps.length>1?medal[Math.min(p.rank,3)]:'⭐'}</div><div class="nm">${esc(p.nick)}${p.id===this.myId?' (나)':''}</div><div class="pts">${N.comma(p.score)}${unit||'점'}</div><div class="st">${p.line||''}${p.done?'':' · 다 못 풀었어요'}</div>`;pod.appendChild(c);});
    if(gone.length)W.appendChild(h('div','hint',`🚪 중간에 나간 친구: ${gone.map(p=>esc(p.nick)).join(', ')}`));},
  buttons(W){const E=this.E;const bt=h('div','res-btns');
    if(this.role==='host'&&!this.gone){const again=h('button','','🔁 같은 방에서 한 판 더');again.onclick=()=>{this.final=false;this.started=false;this.roster.forEach(p=>Object.assign(p,{score:0,prog:0,done:false}));this.bcast({t:'lobby',roster:this.roster,set:this.set});this.showLobby();};
      const out=h('button','sub','방 닫기');out.onclick=()=>{this.leave();E.show('setup');};bt.append(again,out);}
    else{const out=h('button','sub','나가기');out.onclick=()=>{this.leave();E.show('setup');};bt.append(out);
      if(!this.gone)W.appendChild(h('div','hint','⏳ 방장이 한 판 더 하면 대기실로 자동으로 이동해요.'));}
    W.appendChild(bt);},

  leave(silent){this.timers.forEach(clearInterval);this.timers=[];clearTimeout(this.forceT);
    try{if(this.role==='host')this.bcast({t:'close'});else if(this.conn&&this.conn.open)this.conn.send({t:'bye'});}catch(e){}
    const p=this.peer;if(p)setTimeout(()=>{try{p.destroy();}catch(e){}},silent?0:200);
    Object.assign(this,{on:false,role:null,peer:null,conns:[],conn:null,roster:[],myId:null,started:false,final:false,gone:false});},
};
window.Net=Net;
})();


</script>
<script>
/* 5학년 · 용해와 용액 — 비커 받기 대작전 (맞는 것만 받고, 설탕으로 진한 용액 만들기)
   디자인: 하얀 실험실 + 청록. 얼굴이 있는 비커가 표정으로 반응하고, 5연속 정답이면 비커가 커져요. */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const LOGO='<svg class="logo" viewBox="0 0 48 48"><path d="M12 6h24M15 6v14L6 40a3 3 0 0 0 3 4h30a3 3 0 0 0 3-4L33 20V6" fill="#e0f7fa" stroke="#0e7490" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M11 32h26l4 8a3 3 0 0 1-3 4H10a3 3 0 0 1-3-4z" fill="#f97316"/><circle cx="20" cy="26" r="2.5" fill="#fff"/><circle cx="28" cy="22" r="2" fill="#fff"/></svg>';
const SOL={
  dis:{ask:'🧪 물에 <b>녹는</b> 것만 받아요!',sub:'녹지 않는 것은 피해요',
    yes:[['🍬','설탕'],['🧂','소금'],['🧊','각설탕'],['💎','백반'],['🥄','베이킹 소다']],
    no:[['🏖️','모래'],['🖍️','분필 가루'],['🌾','녹말 가루'],['🧲','쇳가루'],['🪵','톱밥'],['🐚','조개껍데기 가루']],

function pill(g,str,x,y,s,bg,fg){g.save();g.font=K.font(s);const w=g.measureText(str).width+s*1.1;K.card(g,x-w/2,y-s*.78,w,s*1.56,s*.78,bg,{blur:s*.5,dy:s*.12,hi:false});K.txt(g,str,x,y+s*.03,{size:s,color:fg});g.restore();}
function lab(g,W,H,u,t,Z0){const fl=H-u*.2;
  K.vgrad(g,0,0,W,fl,['#e6fbff','#d3f3fb','#c4ecf5']);
  g.save();g.strokeStyle='rgba(14,116,144,.07)';g.lineWidth=1;const ts=u*.9;g.beginPath();for(let x=ts;x<W;x+=ts){g.moveTo(x+.5,0);g.lineTo(x+.5,fl);}for(let y=ts;y<fl;y+=ts){g.moveTo(0,y+.5);g.lineTo(W,y+.5);}g.stroke();g.restore();
  const ww=Math.min(W*.42,u*5.2),wh=Math.min((H-Z0)*.3,u*2.6),wx=W/2-ww/2,wy=Z0+u*.3;
  K.glow(g,W/2,wy+wh/2,Math.max(ww,wh)*1.1,'#ffffff',.6);
  K.card(g,wx-u*.12,wy-u*.12,ww+u*.24,wh+u*.24,u*.3,'#f8fafc',{blur:u*.4,dy:u*.12,hi:false});
  g.save();K.rr(g,wx,wy,ww,wh,u*.2);g.clip();K.vgrad(g,wx,wy,ww,wh,['#7cc4ff','#d6f0ff']);
  g.translate(wx,wy);K.clouds(g,ww,wh,t,.25,2,wh*.5);K.hills(g,ww,wh,wh*.72,'#a7e3bd','#6cc995');g.restore();
  g.fillStyle='#f8fafc';g.fillRect(W/2-u*.05,wy,u*.1,wh);g.fillRect(wx,wy+wh*.48,ww,u*.08);
  const sh=(x0,x1,y)=>{K.card(g,x0,y,x1-x0,u*.16,u*.06,'#c79a6b',{blur:u*.3,dy:u*.12,hi:false});g.fillStyle='#e0b689';g.fillRect(x0,y,x1-x0,u*.05);};
  const sw=Math.min(W*.24,u*3.2);const sy=Z0+(H-Z0)*.4;
  [[u*.2,1],[W-u*.2-sw,-1]].forEach(([x0,d],k)=>{sh(x0,x0+sw,sy);g.save();g.globalAlpha=.85;const items=k?['⚗️','🧫','🧪']:['🧪','🔬','⚗️'];items.forEach((e,i)=>K.emo(g,e,x0+sw*(i+.5)/3,sy-u*.42,u*.7));g.restore();});
  K.vgrad(g,0,fl,W,H-fl,['#5b7c99','#3b5672']);g.fillStyle='rgba(255,255,255,.45)';g.fillRect(0,fl,W,Math.max(2,u*.04));}
/* 얼굴 있는 비커: mood = neutral|happy|oops */
function beaker(g,u,t,x,G,color,conc,dense,mood,splash){const bw=G.bw,bh=G.bh,by=G.by;const lv=by+bh*.25,bot=by+bh,r=u*.28;
  K.shadow(g,x,bot+u*.05,bw*.55,u*.12,.3);K.glow(g,x,bot-bh*.4,bw*.75,color,.18);
  const body=()=>{g.beginPath();g.moveTo(x-bw/2,by);g.lineTo(x-bw/2,bot-r);g.quadraticCurveTo(x-bw/2,bot,x-bw/2+r,bot);g.lineTo(x+bw/2-r,bot);g.quadraticCurveTo(x+bw/2,bot,x+bw/2,bot-r);g.lineTo(x+bw/2,by);g.closePath();};
  g.save();body();g.fillStyle='rgba(255,255,255,.35)';g.fill();g.clip();
  const c1=dense?K.rgba('#f9a8d4',.25+conc*.5):'rgba(103,232,249,.75)',c2=dense?K.rgba('#db2777',.25+conc*.45):'rgba(8,145,178,.85)';
  const wob=Math.sin(t*3)*u*.04+(splash||0)*u*.3*Math.sin(t*30);const lg=g.createLinearGradient(0,lv,0,bot);lg.addColorStop(0,c1);lg.addColorStop(1,c2);g.fillStyle=lg;
  g.beginPath();g.moveTo(x-bw/2,lv+wob);g.quadraticCurveTo(x,lv-wob*2,x+bw/2,lv-wob);g.lineTo(x+bw/2,bot);g.lineTo(x-bw/2,bot);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.55)';g.fillRect(x-bw/2,lv-wob*.5,bw,Math.max(2,u*.05));
  g.fillStyle='rgba(255,255,255,.55)';for(let k=0;k<5;k++){const ph=(t*.6+k*.23)%1;g.beginPath();g.arc(x-bw*.35+k*bw*.17,bot-(bot-lv)*ph,u*.05+k%2*u*.03,0,7);g.fill();}
  const hg=g.createLinearGradient(x-bw/2,0,x+bw/2,0);hg.addColorStop(0,'rgba(255,255,255,.55)');hg.addColorStop(.18,'rgba(255,255,255,.08)');hg.addColorStop(.8,'rgba(255,255,255,0)');hg.addColorStop(1,'rgba(255,255,255,.3)');g.fillStyle=hg;g.fillRect(x-bw/2,by,bw,bh);
  g.restore();
  body();g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=Math.max(2,u*.07);g.stroke();
  body();g.strokeStyle='rgba(14,116,144,.45)';g.lineWidth=1.5;g.stroke();
  K.card(g,x-bw/2-u*.12,by-u*.08,bw+u*.24,u*.16,u*.08,'#ffffff',{blur:u*.15,dy:u*.04,hi:false,stroke:'rgba(14,116,144,.35)',lw:1.5});
  g.strokeStyle='rgba(14,116,144,.55)';g.lineWidth=1.5;for(let k=1;k<4;k++){const yy=by+bh*k/4;g.beginPath();g.moveTo(x+bw/2-u*.4,yy);g.lineTo(x+bw/2-u*.08,yy);g.stroke();}
  K.card(g,x-bw*.42,bot+u*.02,bw*.84,u*.12,u*.06,color,{blur:u*.2,dy:u*.05,hi:false});
  /* 얼굴 */
  const fy=by+bh*.5,fs=Math.min(bw*.5,bh*.5);g.save();g.translate(x,fy);g.lineCap='round';g.strokeStyle='#0b3a4a';g.fillStyle='#0b3a4a';g.lineWidth=Math.max(2,fs*.07);
  for(const d of[-1,1]){const ex=d*fs*.28,ey=-fs*.1;g.fillStyle='#fff';g.beginPath();g.ellipse(ex,ey,fs*.14,fs*.17,0,0,TAU);g.fill();g.stroke();
    g.fillStyle='#0b3a4a';if(mood==='oops'){g.beginPath();g.moveTo(ex-fs*.08,ey-fs*.08);g.lineTo(ex+fs*.08,ey+fs*.08);g.moveTo(ex+fs*.08,ey-fs*.08);g.lineTo(ex-fs*.08,ey+fs*.08);g.stroke();}
    else if(mood==='happy'){g.beginPath();g.arc(ex,ey+fs*.03,fs*.08,Math.PI*1.05,Math.PI*1.95);g.stroke();}else{g.beginPath();g.arc(ex,ey+fs*.02,fs*.07,0,TAU);g.fill();}}
  g.beginPath();if(mood==='happy'){g.fillStyle='#be123c';g.arc(0,fs*.1,fs*.17,0,Math.PI);g.fill();g.stroke();}else if(mood==='oops'){g.arc(0,fs*.3,fs*.12,1.15*Math.PI,1.85*Math.PI);g.stroke();}else{g.arc(0,fs*.12,fs*.12,.15*Math.PI,.85*Math.PI);g.stroke();}
  g.restore();}

function heroScene(cv){const g=cv.getContext('2d');let raf=0,W=0,H=0,dpr=1,last=0,T=0,run=false;
  const E=['🍬','🧂','🧊','🥄','💎'];
  const size=()=>{const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);const w=Math.max(10,r.width),h=Math.max(10,r.height);if(w===W&&h===H&&d===dpr)return;W=w;H=h;dpr=d;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);};
  const frame=now=>{if(!run)return;raf=requestAnimationFrame(frame);const dt=Math.max(0,Math.min(.05,(now-last)/1000||0));last=now;T+=dt;size();g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    const wide=W>H*1.25;const u=wide?H/7.5:Math.min(W,H)/6.5;lab(g,W,H,u,T,H*.05);
    const G={bw:Math.min(u*2.6,W*.4),bh:u*2.1,by:H-u*2.3};const per=1.6;const bx=tc=>W/2+Math.sin(tc*.7)*W*.26;
    let splash=0,mood='neutral';const cyc=Math.floor(T/per);
    for(const off of[0,.5]){const tt=T-off*per;const n=Math.floor(tt/per),s=tt-n*per,f=s/per;const xc=bx((n+1)*per+off*per);const y=H*.12+(G.by-u*.2-H*.12)*f*f;if(f>.97)splash=1;
      if(f<=.99){K.glow(g,xc,y,u*.8,'#fff',.7);K.emo(g,E[(((n*2+(off?1:0))%E.length)+E.length)%E.length],xc,y,u*.9,f*2);}}
    const dtc=(T%per)/per;if(dtc<.15||(T+.5*per)%per/per<.15){mood='happy';}
    const x=bx(T);beaker(g,u,T,x,G,'#0891b2',.5+.4*Math.sin(T*.5),false,mood,splash*.5);};
  return{start(){if(run)return;run=true;last=performance.now();raf=requestAnimationFrame(frame);},stop(){run=false;cancelAnimationFrame(raf);}};}
const GAME={
  id:'sci5-solution',title:'비커 받기 대작전',title1:'주르륵 떨어진다!',title2:'비커 받기 대작전',emoji:LOGO,
  subtitle:'5학년 · 용해와 용액',
  howto:'손가락으로 <b>비커를 좌우로</b> 움직여 떨어지는 것을 받아요! 질문에 맞는 것만 받고, 아닌 것은 피해요. <b>진하기</b> 놀이에서는 설탕을 모아 방울토마토를 띄워요.',
  how:'비커를 <b>좌우로</b> 움직여<br>알맞은 것만 받아요!',
  theme:{c1:'#e8541a',c2:'#2563eb'},hero:heroScene,vignette:.05,durs:[60,90,120],levelTitle:'어떤 실험을 할까요?',
  txt:{who:'누가 실험할까요?',dur:'실험 시간',pace:'떨어지는 속도',seat:'번 연구원 ',go:'실험 시작!',s1:'1. 실험',s2:'2. 방법',s3:'3. 이름'},
  levels:[
    {id:'dis',g:'5학년 · 용해와 용액',t:'🍬 물에 녹는 물질',d:'용해와 녹지 않는 물질'},
    {id:'sol',g:'5학년 · 용해와 용액',t:'🥤 용액 찾기',d:'투명하고 가라앉지 않아요'},
    {id:'dense',g:'5학년 · 용해와 용액',t:'🍅 진하기와 방울토마토',d:'진할수록 높이 떠요'},
    {id:'all',g:'5학년 · 용해와 용액',t:'🌟 모두 섞기',d:'번갈아 나와요'},
  ],
  summary:`<ul><li><b>용해</b>: 어떤 물질이 다른 물질에 녹아 고르게 섞이는 것 · <b>용질</b>: 녹는 물질(설탕) · <b>용매</b>: 녹이는 물질(물) · <b>용액</b>: 녹아 고르게 섞인 물질(설탕물)</li>
    <li>용액은 투명하고, 오래 두어도 뜨거나 가라앉는 것이 없어요. 흙탕물·미숫가루 물은 용액이 아니에요.</li>
    <li>물질마다 같은 양의 물에 녹는 양이 달라요. 물의 온도가 높을수록 대체로 더 많이 녹아요. 녹은 뒤에도 무게는 그대로예요.</li>
    <li>용액이 <b>진할수록</b> 물체(방울토마토)가 더 높이 떠요. 물을 더 넣으면 묽어져요.</li></ul>`,
  Z(p){const u=p.u;return{y0:Math.max(p.top||0,u*2.6)};},
  init(p){const st=p.state;Object.assign(st,{x:p.W/2,tx:p.W/2,items:[],spawnT:.3,kN:0,cnt:0,conc:0,splash:0,T:0,mood:'neutral',moodT:0,big:0,lastS:0});this.useSet(p);},
  useSet(p){const st=p.state,L=p.levelId;st.k=L==='all'?['dis','sol','dense','word'][st.kN++%4]:L;st.cnt=0;
    if(st.k==='dense'){st.conc=0;p.ask('🍅 <b>설탕</b>을 받아 방울토마토를 <b>맨 위 선</b>까지 띄워요!','물(💧)을 받으면 묽어져요 · 모래는 피해요');}
    else p.ask(SOL[st.k].ask,SOL[st.k].sub);},
  spawn(p){const st=p.state,R=p.Rf,u=p.u,Z=this.Z(p);let a,good,kind;
    if(st.k==='dense'){const r=R.f();if(r<.55){a=['🍬','설탕'];good=true;kind='s';}else if(r<.8){a=['💧','물'];good=false;kind='w';}else{a=['🏖️','모래'];good=false;kind='x';}}
    else{const S=SOL[st.k];good=R.chance(.5);a=p.deck(good?S.yes:S.no,st.k+(good?'y':'n'));}
    st.items.push({a,good,kind,x:R.num(u*1.2,p.W-u*1.2),y:Z.y0-u*.3,vy:u*R.num(2.2,2.8)*(1+p.t/p.dur*.5)*p.pace,rot:R.num(-1,1),age:0});st.cnt++;
    if(p.levelId==='all'&&st.cnt>=(st.k==='word'?6:12))this.useSet(p);st.spawnT=R.num(.65,1.05)/Math.sqrt(p.pace);},
  geo(p){const u=p.u,st=p.state;const k=st.big>0?1.45:1;return{bw:Math.min(u*2.6*k,p.W*.42*k),bh:u*2.1,by:p.H-u*2.3};},
  update(p,dt){const st=p.state,u=p.u,G=this.geo(p);st.T+=dt;if(st.moodT>0){st.moodT-=dt;if(st.moodT<=0)st.mood='neutral';}if(st.big>0)st.big-=dt;
    if(p.streak===0)st.lastS=0;else if(p.streak>=5&&p.streak%5===0&&st.lastS!==p.streak){st.lastS=p.streak;st.big=6;p.tip('✨ 5연속 성공! 비커가 커졌어요','good',1500);}
    st.x+=(st.tx-st.x)*Math.min(1,dt*12);st.x=K.clamp(st.x,G.bw/2,p.W-G.bw/2);
    st.spawnT-=dt;if(st.spawnT<=0)this.spawn(p);st.splash=Math.max(0,st.splash-dt);
    for(const it of st.items){it.y+=it.vy*dt;it.age+=dt;
      if(!it.done&&it.y>G.by-u*.2&&it.y<G.by+u*.6&&Math.abs(it.x-st.x)<G.bw/2){it.done=true;st.splash=.3;p.Snd.tone(500,.08,'sine',.05);const nm=it.a[1];let ok=it.good;
        if(st.k==='dense'){if(it.kind==='s'){ok=true;st.conc=Math.min(1,st.conc+.14);p.hit(true,{x:it.x,y:G.by-u,tip:'설탕이 녹아 설탕물이 더 진해졌어요',tipMs:1200});if(st.conc>=.99){p.add(80,st.x,G.by-u*3);p.tip('🎉 아주 진한 설탕물! 방울토마토가 높이 떴어요','good',1800);p.Snd.win();st.conc=0;}}

        else{const S=SOL[st.k];if(it.good)p.hit(true,{x:it.x,y:G.by-u,tip:`${nm}: ${S.tipYes}`,tipMs:1300});
          else p.hit(false,{x:it.x,y:G.by-u,tip:`${nm}${S.tipNo.replace('은(는)',J(nm,'은').slice(nm.length))}`,review:`${nm}${S.tipNo.replace('은(는)',J(nm,'은').slice(nm.length))}`});}
        st.mood=ok?'happy':'oops';st.moodT=.9;}}
    st.items=st.items.filter(it=>!it.done&&it.y<p.H+u);},
  draw(p,g){const W=p.W,H=p.H,u=p.u,st=p.state,G=this.geo(p),Z=this.Z(p);

    if(st.k==='dense'){const ty=by+bh-u*.45-(bh*.62)*st.conc;K.emo(g,'🍅',x+bw*.0,ty+bh*.0,u*.65);

      K.txt(g,'🎯',x+bw/2+u*.3,ly,{size:u*.34});

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>용돈 기입장</title>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2A26;--paper:#FBF5E6;--muted:#6B6552;--ac:#F59E0B}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Gamja Flower','Malgun Gothic',sans-serif;color:var(--ink);background:radial-gradient(rgba(120,90,40,.15) 1.5px,transparent 1.6px) 0 0/16px 16px,#F3DFA8;padding:14px}
.w{max-width:860px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 7px 0 var(--ink);padding:18px 20px}
h1{margin:0 0 4px;font-weight:400;font-size:clamp(26px,5vw,38px)}h1 em{font-style:normal;color:#D97706}
p{margin:4px 0;color:var(--muted)}
.f{display:grid;grid-template-columns:110px 1fr 120px 120px auto;gap:8px;margin-top:10px}
@media(max-width:700px){.f{grid-template-columns:1fr 1fr}}
input,select{font:inherit;font-size:17px;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;min-width:0;background:#fff}
button{font:inherit;font-size:17px;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:8px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button.p{background:var(--ac)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:17px}
th,td{border:2px solid var(--ink);padding:6px 8px;text-align:right}th{background:#FDE68A;font-weight:400}
td:nth-child(1),td:nth-child(2),th:nth-child(2){text-align:left}
td button{padding:2px 8px;font-size:14px;box-shadow:none}
.sm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.sm div{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;text-align:center}
.sm b{display:block;font-weight:400;font-size:24px}
.in{color:#15803D}.out{color:#B91C1C}
.foot{text-align:center;color:var(--muted);font-size:14px}
@media print{body{background:#fff}.f,.noprint{display:none}}
/* ── 새 디자인: 돼지 저금통 가계부 (분홍 + 줄 노트 + 동전) ── */
:root{--ink:#5a2140;--paper:#fffafc;--muted:#9a5b7c;--ac:#ff8fb8}
body{background:#ffd9e8;background-image:radial-gradient(circle,#fff 3px,transparent 4px),radial-gradient(circle,#ffc2d9 5px,transparent 6px);background-size:46px 46px,92px 92px;background-position:0 0,23px 23px}
.card{background:#fffafc;background-image:repeating-linear-gradient(transparent 0 33px,#ffd0e2 33px 35px);border:4px solid #ff8fb8;border-radius:28px;box-shadow:0 8px 0 #e2558c;position:relative}
.card::before{content:'';position:absolute;left:18px;top:-14px;width:calc(100% - 36px);height:26px;background:radial-gradient(circle at 14px 13px,#e2558c 6px,transparent 7px) 0 0/40px 26px repeat-x}
h1{color:#e2558c}h1 em{color:#ff5c9a}
input,select{border:3px solid #ff8fb8;border-radius:16px;background:#fff}
button{border:3px solid #e2558c;border-radius:999px;box-shadow:0 4px 0 #e2558c;color:#5a2140}button.p{background:#ffd23f}
th{background:#ffd0e2}td,th{border:2px solid #ffb3cf}
.sm div{border:3px solid #ff8fb8;border-radius:20px;background:#fff}
.in{color:#0f9b6e}.out{color:#e0245e}
#goalBox{margin-top:12px;background:#fff;border:3px dashed #ff8fb8;border-radius:20px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#goalBox input{width:130px}
#goalBox .bar{flex:1;min-width:140px;height:22px;border:3px solid #e2558c;border-radius:999px;background:#ffe9f2;overflow:hidden}
#goalBox .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff8fb8);transition:width .6s}
#pig{font-size:clamp(34px,7vw,52px);transition:transform .3s}#pig.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
#coinFx{position:fixed;font-size:30px;pointer-events:none;z-index:30;animation:coin 1s ease-in forwards}
@keyframes coin{0%{transform:translateY(-80px) rotate(0);opacity:1}100%{transform:translateY(60px) rotate(360deg);opacity:0}}
.foot{color:#9a5b7c}

</style></head><body><div class="w">
<div class="card"><h1>용돈 <em>기입장</em></h1><p>받은 돈(수입)과 쓴 돈(지출)을 적으면 남은 돈이 자동으로 계산돼요. 이 기기에 저장돼요.</p>
<div class="f"><input type="date" id="d"><input id="t" placeholder="내용 (예: 문구점 공책)"><input id="i" type="number" min="0" placeholder="받은 돈"><input id="o" type="number" min="0" placeholder="쓴 돈"><button class="p" id="add">적기</button></div>
<div class="sm"><div>받은 돈<b class="in" id="si">0원</b></div><div>쓴 돈<b class="out" id="so">0원</b></div><div>남은 돈<b id="sb">0원</b></div></div>
<div id="goalBox"><span id="pig">🐷</span><b>저금 목표</b><input id="goal" type="number" min="0" placeholder="예: 5000"><span>원</span><div class="bar"><i></i></div><span id="pct">0%</span></div>
<table><thead><tr><th>날짜</th><th>내용</th><th>받은 돈</th><th>쓴 돈</th><th>남은 돈</th><th class="noprint"></th></tr></thead><tbody id="tb"></tbody></table>
<p class="noprint" style="margin-top:12px"><button id="pr">인쇄하기</button> <button id="cl">모두 지우기</button></p></div>
<div class="foot">제작 : 비춤이샘</div></div>
<script>
const $=i=>document.getElementById(i),K='bichum_allowance_book';let R=[];
try{R=JSON.parse(localStorage.getItem(K)||'[]');}catch(e){}
$('d').value=new Date().toISOString().slice(0,10);
const w=n=>n.toLocaleString('ko-KR')+'원';
function save(){try{localStorage.setItem(K,JSON.stringify(R));}catch(e){}}
function draw(){let b=0,si=0,so=0;$('tb').innerHTML=R.map((r,k)=>{b+=r.i-r.o;si+=r.i;so+=r.o;return `<tr><td>${r.d.slice(5).replace('-','/')}</td><td>${r.t.replace(/[<>&]/g,'')}</td><td class="in">${r.i?w(r.i):''}</td><td class="out">${r.o?w(r.o):''}</td><td>${w(b)}</td><td class="noprint"><button data-k="${k}">✕</button></td></tr>`;}).join('');
 $('si').textContent=w(si);$('so').textContent=w(so);$('sb').textContent=w(b);}
$('add').onclick=()=>{const i=+$('i').value||0,o=+$('o').value||0,t=$('t').value.trim();if(!t||(!i&&!o))return;R.push({d:$('d').value,t,i,o});save();$('t').value='';$('i').value='';$('o').value='';draw();};
$('tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;R.splice(+b.dataset.k,1);save();draw();};
$('pr').onclick=()=>window.print();$('cl').onclick=()=>{if(confirm('모두 지울까요?')){R=[];save();draw();}};
draw();
</script><script>
let __ac;function beep(f,d,t='sine',v=.05){try{__ac=__ac||new(window.AudioContext||window.webkitAudioContext)();const o=__ac.createOscillator(),g=__ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,__ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,__ac.currentTime+d);o.connect(g);g.connect(__ac.destination);o.start();o.stop(__ac.currentTime+d);}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*100));}
function confetti(n=140,ox=.5,oy=.6){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const g=c.getContext('2d');const ps=Array.from({length:n},()=>({x:c.width*ox,y:c.height*oy,vx:(Math.random()-.5)*16,vy:-Math.random()*17-4,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6+3,a:Math.random()*6}));let t=0;(function f(){t++;g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.a+=.2;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore();});if(t<120)requestAnimationFrame(f);else c.remove();})();}

(function(){
const $=id=>document.getElementById(id);
let goal=0;try{goal=+localStorage.getItem('bichum_allowance_goal')||0;}catch(e){}
$('goal').value=goal||'';
let reached=false,lastLen=null;
function upd(){const b=+($('sb').textContent.replace(/[^\d-]/g,''))||0;const g=+$('goal').value||0;const p=g?Math.max(0,Math.min(100,Math.round(b/g*100))):0;$('goalBox').querySelector('.bar i').style.width=p+'%';$('pct').textContent=g?p+'%':'';
  $('pig').textContent=!g?'🐷':p>=100?'🤑':p>=50?'😊':'🐷';
  if(g&&b>=g&&!reached){reached=true;fanfare();confetti(150,.5,.4);}if(!g||b<g)reached=false;}
$('goal').oninput=()=>{try{localStorage.setItem('bichum_allowance_goal',$('goal').value);}catch(e){}upd();};
new MutationObserver(upd).observe($('sb'),{childList:true,characterData:true,subtree:true});
$('add').addEventListener('click',()=>{const i=+$('i').value||0,o=+$('o').value||0;if(!$('t').value.trim()||(!i&&!o))return;const c=document.createElement('div');c.id='coinFx';c.textContent=i?'🪙':'💸';const r=$('pig').getBoundingClientRect();c.style.left=(r.left+10)+'px';c.style.top=(r.top-20)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),1000);$('pig').classList.remove('hop');void $('pig').offsetWidth;$('pig').classList.add('hop');beep(i?1175:330,.12,i?'triangle':'sawtooth',.05);if(i)setTimeout(()=>beep(1568,.14,'triangle',.05),90);});
upd();
})();

</script>
</body></html>

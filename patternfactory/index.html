<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무늬 공장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap" rel="stylesheet">
<style>
:root{--ink:#2D2340;--paper:#FFFDF8;--accent:#F15BB5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Hi Melody','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:#EFE7F5;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #2F80ED;outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--ink);color:#fff}
.top h1{margin:0 6px 0 2px;font-weight:400;font-size:clamp(16px,2.4vw,24px);white-space:nowrap}
.top h1 em{font-style:normal;color:#FFB3E1}
.sp{flex:1}
.tb{border:0;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 11px;font-size:clamp(13px,1.7vw,17px);color:#fff;white-space:nowrap}
.tb.save{background:var(--accent)}
.side{grid-row:2;width:clamp(200px,26vw,300px);background:var(--paper);border-right:3px solid var(--ink);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:12px}
.grp h3{margin:0 0 6px;font-weight:400;font-size:14px;color:#7E6F93}
.tilewrap{position:relative;width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;touch-action:none}
.tilewrap canvas{position:absolute;inset:0;width:100%;height:100%}
.tilewrap .g{pointer-events:none}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.tools button,.seg button{border:2px solid #DCD1E8;background:#fff;border-radius:10px;padding:5px 2px;font-size:12px;line-height:1.15}
.tools button b{display:block;font-weight:400;font-size:18px}
.tools button.on,.seg button.on{border-color:var(--ink);background:#FFE3F3}
.cols{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cols button{aspect-ratio:1;border-radius:50%;border:2px solid rgba(0,0,0,.15);padding:0}
.cols button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg svg{width:100%;height:28px;display:block}
.size{display:flex;align-items:center;gap:8px;font-size:13px}
.size input{flex:1;accent-color:var(--accent)}
.stage{grid-row:2;position:relative;overflow:hidden;background:#fff}
#out{position:absolute;inset:0;width:100%;height:100%}
.mock{position:absolute;right:14px;bottom:14px;display:flex;gap:10px}
.mock button{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 10px;font-size:14px;box-shadow:0 4px 0 var(--ink)}
.mock button.on{background:#FFE3F3}
.maker{position:fixed;right:10px;bottom:2px;font-size:11px;color:rgba(45,35,64,.55);pointer-events:none}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:760px),(max-aspect-ratio:4/5){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  .side{grid-row:3;width:auto;max-height:46vh;border-right:0;border-top:3px solid var(--ink);display:grid;grid-template-columns:40% 1fr;align-items:start}
  .grp.tile{grid-row:span 3}
  .top h1{font-size:15px}
  .tb .lb{display:none}
  .mock{right:8px;bottom:8px}.mock button{padding:4px 7px;font-size:12px}
}
/* ── 새 디자인: 무늬 공장 (직물 공장 · 컨베이어 띠 · 민트와 분홍) ── */
:root{--ink:#16445a;--paper:#f4fffb;--accent:#ff5d8f}
body{background:#cdeee6;background-image:repeating-linear-gradient(45deg,rgba(22,68,90,.06) 0 14px,transparent 14px 28px)}
.top{background:repeating-linear-gradient(90deg,#16445a 0 26px,#1d5973 26px 52px);border-bottom:6px solid #ff5d8f}
.top h1{font-size:clamp(18px,2.8vw,30px);letter-spacing:.03em}.top h1 em{color:#ffd1e1}
.tb{background:#f4fffb;color:#16445a;border-radius:8px;border:3px solid #ffffff55}
.tb.save{background:#ff5d8f;color:#fff}
.side{background:#f4fffb;border-right:6px double #16445a;gap:10px;padding:10px;width:clamp(240px,29vw,360px)}
.grp{background:#fff;border:3px solid #16445a;border-radius:10px;padding:8px;position:relative}
.grp h3{display:inline-block;background:#16445a;color:#fff;border-radius:6px;padding:2px 10px;font-size:14px;margin:-18px 0 8px -2px}
.grp{margin-top:8px}
.tilewrap{border-radius:6px;box-shadow:0 0 0 4px #ffd1e1,0 6px 0 4px #16445a;background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.tools button,.seg button{border-color:#16445a;border-radius:8px;background:#fff}
.tools button.on,.seg button.on{background:#ffd1e1;box-shadow:0 3px 0 #16445a}
.cols button{border:3px solid #16445a}.cols button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #ff5d8f}
.stage{background:#fff;box-shadow:inset 0 0 0 8px #16445a,inset 0 0 0 14px #ffd1e1}
.mock button{border-color:#16445a;box-shadow:0 4px 0 #16445a}.mock button.on{background:#ffd1e1}
.maker{left:12px;right:auto;bottom:4px}
@media (min-aspect-ratio:5/4) and (min-width:761px){
  .side{display:grid;grid-template-columns:1fr;align-content:start;gap:8px;padding:8px}
  .grp{margin-top:6px;padding:6px 8px}.tools{grid-template-columns:repeat(8,1fr)}.tools button b{font-size:15px}.tools button{font-size:10px}
  .cols{grid-template-columns:repeat(8,1fr)}
  .tilewrap{width:min(100%,27vh);margin:0 auto}
}
@media (max-width:760px),(max-aspect-ratio:4/5){.side{border-right:0;border-top:6px double #16445a}.grp h3{margin-top:-14px}}
@media (min-aspect-ratio:5/4) and (min-width:761px){.seg svg{height:20px}.seg button{padding:3px 2px;font-size:11px}.grp{padding:5px 7px}.size{font-size:12px}.cols button{border-width:2px}}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>🔁 무늬 <em>공장</em></h1>
    <div class="sp"></div>
    <button class="tb" id="undo">↶<span class="lb"> 되돌리기</span></button>
    <button class="tb" id="random">🎲<span class="lb"> 예시 무늬</span></button>
    <button class="tb" id="clear">🗑️<span class="lb"> 새 타일</span></button>
    <button class="tb" id="fs">⛶</button>
    <button class="tb save" id="save">💾<span class="lb"> 저장</span></button>
  </div>
  <div class="side">
    <div class="grp tile"><h3>① 타일 하나를 그려요</h3><div class="tilewrap" id="tw"><canvas id="tile"></canvas><canvas id="tg" class="g"></canvas></div>
      <div class="tools" id="tools"></div></div>
    <div class="grp"><h3>색</h3><div class="cols" id="cols"></div><div class="size" style="margin-top:6px">굵기 <input type="range" id="size" min="2" max="40" value="10"></div></div>
    <div class="grp"><h3>② 늘어놓는 방법</h3><div class="seg" id="lay"></div></div>
    <div class="grp"><h3>③ 크기와 바탕</h3><div class="size">타일 크기 <input type="range" id="scale" min="40" max="260" value="120"></div><div class="seg two" id="bgs" style="margin-top:6px"></div></div>
  </div>
  <div class="stage" id="stage"><canvas id="out"></canvas>
    <div class="mock" id="mock"><button data-m="flat" class="on">🧱 판</button><button data-m="gift">🎁 선물 상자</button><button data-m="shirt">👕 티셔츠</button></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="maker">제작 : 비춤이샘</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const T=300;
const tile=$('tile'),tc=tile.getContext('2d'),tg=$('tg'),gc=tg.getContext('2d'),out=$('out'),oc=out.getContext('2d');
tile.width=tile.height=tg.width=tg.height=T;
const COLS=['#1B1B1B','#FFFFFF','#E63946','#FF7F50','#FFB703','#FFE66D','#8AC926','#2A9D8F','#06AED5','#1D4ED8','#7209B7','#F15BB5','#9C6644','#FFC8DD','#BDE0FE','#D0F4DE'];
const LAYS=[['grid','그대로',[0,0,0,0]],['brick','벽돌',[0,0,0,0]],['mirror','거울',[0,1,1,0]],['flip','뒤집기',[0,0,0,0]],['rotate','돌리기',[0,0,0,0]],['half','엇갈리기',[0,0,0,0]]];
const BGS=[['white','하양'],['cream','미색'],['pink','분홍'],['sky','하늘'],['mint','민트'],['night','밤하늘']];
const BGC={white:'#FFFFFF',cream:'#FBF3E0',pink:'#FFE3F0',sky:'#E2F1FF',mint:'#E3FAF0',night:'#1D1A39'};
let tool='pen',color='#F15BB5',size=10,lay='mirror',scale=120,bg='white',mock='flat';
const undo=[];
const TOOLS=[['pen','✏️','펜'],['circle','⚪','동그라미'],['rect','⬜','네모'],['tri','🔺','세모'],['heart','❤️','하트'],['star','⭐','별'],['line','📏','직선'],['erase','🧽','지우개']];
$('tools').innerHTML=TOOLS.map(([k,i,l])=>`<button data-k="${k}" class="${k===tool?'on':''}"><b>${i}</b>${l}</button>`).join('');
$('cols').innerHTML=COLS.map(c=>`<button data-c="${c}" class="${c===color?'on':''}" style="background:${c}"></button>`).join('');
const lsvg=k=>{const s='<svg viewBox="0 0 60 28">',c=(x,y,t)=>`<g transform="translate(${x} ${y}) ${t}"><path d="M-6 -5 L6 -5 L-6 5Z" fill="#F15BB5"/></g>`;
  const m={grid:c(10,8,'')+c(30,8,'')+c(50,8,'')+c(10,20,'')+c(30,20,'')+c(50,20,''),brick:c(10,8,'')+c(30,8,'')+c(50,8,'')+c(20,20,'')+c(40,20,''),mirror:c(10,8,'')+c(30,8,'scale(-1 1)')+c(50,8,'')+c(10,20,'scale(1 -1)')+c(30,20,'scale(-1 -1)')+c(50,20,'scale(1 -1)'),flip:c(10,8,'')+c(30,8,'scale(1 -1)')+c(50,8,'')+c(10,20,'scale(1 -1)')+c(30,20,'')+c(50,20,'scale(1 -1)'),rotate:c(10,8,'')+c(30,8,'rotate(90)')+c(50,8,'rotate(180)')+c(10,20,'rotate(270)')+c(30,20,'')+c(50,20,'rotate(90)'),half:c(10,8,'')+c(30,8,'')+c(50,8,'')+c(10,22,'')+c(30,18,'')+c(50,22,'')};return s+m[k]+'</svg>';};
$('lay').innerHTML=LAYS.map(([k,l])=>`<button data-k="${k}" class="${k===lay?'on':''}">${lsvg(k)}${l}</button>`).join('');
$('bgs').innerHTML=BGS.map(([k,l])=>`<button data-k="${k}" class="${k===bg?'on':''}"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${BGC[k]};border:1px solid #999;vertical-align:-1px"></span> ${l}</button>`).join('');
function on(box,attr,v){box.querySelectorAll(`[data-${attr}]`).forEach(b=>b.classList.toggle('on',b.dataset[attr]===v));}
$('tools').onclick=e=>{const b=e.target.closest('[data-k]');if(b){tool=b.dataset.k;on($('tools'),'k',tool);}};
$('cols').onclick=e=>{const b=e.target.closest('[data-c]');if(b){color=b.dataset.c;on($('cols'),'c',color);if(tool==='erase'){tool='pen';on($('tools'),'k','pen');}}};
$('lay').onclick=e=>{const b=e.target.closest('[data-k]');if(b){lay=b.dataset.k;on($('lay'),'k',lay);render();}};
$('bgs').onclick=e=>{const b=e.target.closest('[data-k]');if(b){bg=b.dataset.k;on($('bgs'),'k',bg);render();}};
$('mock').onclick=e=>{const b=e.target.closest('[data-m]');if(b){mock=b.dataset.m;on($('mock'),'m',mock);render();}};
$('size').oninput=()=>size=+$('size').value;
$('scale').oninput=()=>{scale=+$('scale').value;render();};
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1600);}
// 타일 안내선
gc.strokeStyle='rgba(120,100,160,.25)';gc.setLineDash([6,6]);gc.lineWidth=1;[T/2].forEach(v=>{gc.beginPath();gc.moveTo(v,0);gc.lineTo(v,T);gc.stroke();gc.beginPath();gc.moveTo(0,v);gc.lineTo(T,v);gc.stroke();});
/* ---------- 타일 그리기 (가장자리를 넘으면 반대편에 이어져요) ---------- */
function wrapDraw(fn){for(const dx of [-T,0,T])for(const dy of [-T,0,T]){tc.save();tc.translate(dx,dy);fn();tc.restore();}}
function shape(k,x0,y0,x1,y1){
  const x=Math.min(x0,x1),y=Math.min(y0,y1),w=Math.abs(x1-x0),h=Math.abs(y1-y0),cx=(x0+x1)/2,cy=(y0+y1)/2;
  wrapDraw(()=>{tc.fillStyle=color;tc.strokeStyle=color;tc.lineWidth=size;tc.lineCap='round';tc.beginPath();
    if(k==='circle')tc.ellipse(cx,cy,Math.max(2,w/2),Math.max(2,h/2),0,0,7);
    else if(k==='rect')tc.rect(x,y,Math.max(4,w),Math.max(4,h));
    else if(k==='tri'){tc.moveTo(cx,y);tc.lineTo(x+w,y+h);tc.lineTo(x,y+h);tc.closePath();}
    else if(k==='heart'){const s=Math.max(w,h)/2||10;tc.moveTo(cx,cy+s*.9);tc.bezierCurveTo(cx-s*1.6,cy-s*.1,cx-s*.8,cy-s*1.2,cx,cy-s*.4);tc.bezierCurveTo(cx+s*.8,cy-s*1.2,cx+s*1.6,cy-s*.1,cx,cy+s*.9);}
    else if(k==='star'){const R=Math.max(w,h)/2||10;for(let i=0;i<10;i++){const r=i%2?R*.45:R,a=-Math.PI/2+i*Math.PI/5;tc.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}tc.closePath();}
    else if(k==='line'){tc.moveTo(x0,y0);tc.lineTo(x1,y1);tc.stroke();return;}
    tc.fill();});
}
function seg(x0,y0,x1,y1){wrapDraw(()=>{tc.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';tc.strokeStyle=color;tc.lineWidth=tool==='erase'?size*2:size;tc.lineCap=tc.lineJoin='round';tc.beginPath();tc.moveTo(x0,y0);tc.lineTo(x1,y1);tc.stroke();});tc.globalCompositeOperation='source-over';}
const tw=$('tw');let st=null;
function tpos(e){const r=tw.getBoundingClientRect();return[(e.clientX-r.left)*T/r.width,(e.clientY-r.top)*T/r.height];}
function snap(){const c=document.createElement('canvas');c.width=c.height=T;c.getContext('2d').drawImage(tile,0,0);return c;}
tw.addEventListener('pointerdown',e=>{e.preventDefault();try{tw.setPointerCapture(e.pointerId);}catch(_){}const [x,y]=tpos(e);undo.push(snap());if(undo.length>25)undo.shift();st={x,y,sx:x,sy:y,base:snap()};if(tool==='pen'||tool==='erase'){seg(x,y,x+.1,y+.1);render();}});
tw.addEventListener('pointermove',e=>{if(!st)return;const [x,y]=tpos(e);
  if(tool==='pen'||tool==='erase'){seg(st.x,st.y,x,y);st.x=x;st.y=y;}
  else{tc.clearRect(0,0,T,T);tc.drawImage(st.base,0,0);shape(tool,st.sx,st.sy,x,y);}
  render();});
const up=e=>{if(!st)return;const [x,y]=tpos(e);if(!(tool==='pen'||tool==='erase')){tc.clearRect(0,0,T,T);tc.drawImage(st.base,0,0);const d=Math.hypot(x-st.sx,y-st.sy);if(d<6){shape(tool,st.sx-25,st.sy-25,st.sx+25,st.sy+25);}else shape(tool,st.sx,st.sy,x,y);}st=null;render();};
tw.addEventListener('pointerup',up);tw.addEventListener('pointercancel',up);
$('undo').onclick=()=>{if(!undo.length)return;tc.clearRect(0,0,T,T);tc.drawImage(undo.pop(),0,0);render();};
$('clear').onclick=()=>{if(!confirm('타일을 지우고 새로 그릴까요?'))return;undo.push(snap());tc.clearRect(0,0,T,T);render();};
/* ---------- 늘어놓기 ---------- */
function tileAt(i,j){
  // [가로 뒤집기, 세로 뒤집기, 회전(90° 단위), 가로 밀기]
  switch(lay){
    case 'grid':return[false,false,0,0];
    case 'brick':return[false,false,0,j%2?.5:0];
    case 'mirror':return[i%2===1,j%2===1,0,0];
    case 'flip':return[false,(i+j)%2===1,0,0];
    case 'rotate':return[false,false,[0,1,3,2][i+j*2],0];
    case 'half':return[false,false,0,0,i%2?.5:0];
  }
}
function paint(ctx,w,h,s){
  ctx.fillStyle=BGC[bg];ctx.fillRect(0,0,w,h);
  const cols=Math.ceil(w/s)+2,rows=Math.ceil(h/s)+2;
  for(let j=-1;j<rows;j++)for(let i=-1;i<cols;i++){
    const [fx,fy,rot,ox,oy]=tileAt(((i%2)+2)%2,((j%2)+2)%2);
    const x=(i+(ox||0))*s,y=(j+(oy||0))*s;
    ctx.save();ctx.translate(x+s/2,y+s/2);ctx.rotate(rot*Math.PI/2);ctx.scale(fx?-1:1,fy?-1:1);ctx.drawImage(tile,-s/2,-s/2,s,s);ctx.restore();
  }
}
function render(){
  const r=$('stage').getBoundingClientRect(),dpr=devicePixelRatio||1;out.width=r.width*dpr;out.height=r.height*dpr;
  const W=out.width,H=out.height,s=scale*dpr;
  if(mock==='flat'){paint(oc,W,H,s);return;}
  oc.fillStyle='#EFE7F5';oc.fillRect(0,0,W,H);
  const pat=document.createElement('canvas');pat.width=W;pat.height=H;paint(pat.getContext('2d'),W,H,s*.6);
  oc.save();oc.beginPath();
  const m=Math.min(W,H)*.8,cx=W/2,cy=H/2+H*.03;
  if(mock==='gift'){oc.rect(cx-m*.42,cy-m*.32,m*.84,m*.7);}
  else{const u=m/10;oc.moveTo(cx-u*2,cy-u*4.2);oc.quadraticCurveTo(cx,cy-u*3.2,cx+u*2,cy-u*4.2);oc.lineTo(cx+u*4.6,cy-u*3.2);oc.lineTo(cx+u*5.6,cy-u*.6);oc.lineTo(cx+u*3.6,cy+u*.2);oc.lineTo(cx+u*3.4,cy+u*4.6);oc.lineTo(cx-u*3.4,cy+u*4.6);oc.lineTo(cx-u*3.6,cy+u*.2);oc.lineTo(cx-u*5.6,cy-u*.6);oc.lineTo(cx-u*4.6,cy-u*3.2);oc.closePath();}
  oc.shadowColor='rgba(0,0,0,.25)';oc.shadowBlur=30*dpr;oc.fillStyle='#fff';oc.fill();oc.shadowBlur=0;oc.clip();oc.drawImage(pat,0,0);oc.restore();
  oc.lineWidth=4*dpr;oc.strokeStyle='#2D2340';oc.stroke();
  if(mock==='gift'){oc.fillStyle='#E63946';oc.fillRect(cx-m*.05,cy-m*.32,m*.1,m*.7);oc.fillRect(cx-m*.42,cy-m*.02,m*.84,m*.08);
    oc.beginPath();oc.ellipse(cx-m*.1,cy-m*.36,m*.1,m*.06,-.4,0,7);oc.ellipse(cx+m*.1,cy-m*.36,m*.1,m*.06,.4,0,7);oc.fill();}
}
new ResizeObserver(render).observe($('stage'));
/* ---------- 예시 무늬 ---------- */
$('random').onclick=()=>{undo.push(snap());tc.clearRect(0,0,T,T);const p=[...COLS].sort(()=>Math.random()-.5).filter(c=>c!=='#FFFFFF').slice(0,3);
  const k=['circle','heart','star','tri','rect'];for(let n=0;n<5;n++){color=p[n%3];const t=k[Math.floor(Math.random()*k.length)],x=Math.random()*T,y=Math.random()*T,r=20+Math.random()*50;shape(t,x-r,y-r,x+r,y+r);}
  color=p[0];size=6;seg(0,T*.8,T,T*.2);size=+$('size').value;color='#F15BB5';render();toast('예시 무늬예요. 그 위에 더 그려 봐요!');};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
$('save').onclick=()=>{const c=document.createElement('canvas');c.width=1600;c.height=1200;const x=c.getContext('2d');paint(x,1600,1200,scale*2);
  const d=new Date();c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`무늬_${d.getMonth()+1}월${d.getDate()}일_${d.getHours()}시${d.getMinutes()}분.png`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('무늬를 저장했어요! 포장지로 인쇄해 봐요');});};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$('undo').click();}});
// 처음엔 예시로 시작
$('random').onclick();undo.length=0;render();
})();
</script>
</body>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전광판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;background:#05070D;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible{outline:3px solid #60A5FA;outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:1vh;padding:1.2vh 1.2vw}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar h1{margin:0;font-weight:400;font-size:clamp(16px,2.2vw,24px);color:#FDE047}
.sp{flex:1}
.tb{border:0;border-radius:10px;padding:7px 12px;font-size:clamp(13px,1.5vw,16px);background:rgba(255,255,255,.12)}
.tb.on{background:#FDE047;color:#111}
.clockbox{display:flex;align-items:center;justify-content:center;gap:2vw;background:linear-gradient(180deg,#111827,#0B0F19);border:3px solid #1F2937;border-radius:2vh;padding:1vh 2vw;box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
.clock{font-family:Orbitron,monospace;font-weight:900;font-size:clamp(48px,13vh,150px);color:#FDE047;text-shadow:0 0 18px rgba(253,224,71,.6);letter-spacing:.04em;line-height:1;cursor:pointer;min-width:4.6ch;text-align:center}
.clock.low{color:#F87171;text-shadow:0 0 18px rgba(248,113,113,.7);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.ccol{display:flex;flex-direction:column;gap:6px;align-items:center}
.cbtn{border:0;border-radius:12px;padding:8px 16px;font-size:clamp(16px,2.6vh,24px);background:#22C55E;color:#062;min-width:7em}
.cbtn.pause{background:#F59E0B;color:#3A2300}
.mini{display:flex;gap:4px}
.mini button{border:0;border-radius:8px;background:rgba(255,255,255,.12);padding:4px 8px;font-size:14px}
.period{display:flex;flex-direction:column;align-items:center;font-size:clamp(14px,2.2vh,20px);color:#93C5FD}
.period b{font-family:Orbitron,monospace;font-size:clamp(30px,7vh,70px);color:#fff;line-height:1}
.teams{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1.2vw;min-height:0}
.team{position:relative;border-radius:2.2vh;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,#0B0F19),#0B0F19 70%);border:4px solid var(--c);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.tname{background:var(--c);color:#0B0F19;text-align:center;font-size:clamp(18px,4vh,40px);padding:.3vh 0;border:0;width:100%;outline:none}
.score{font-family:Orbitron,monospace;font-weight:900;display:grid;place-items:center;font-size:min(30vh,calc(30vw / var(--n) * 1.6));color:#fff;text-shadow:0 0 30px color-mix(in srgb,var(--c) 80%,transparent);cursor:pointer;line-height:1;touch-action:manipulation}
.score.bump{animation:bump .35s cubic-bezier(.2,1.6,.5,1)}
@keyframes bump{from{transform:scale(1.25)}}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.btns button{border:0;border-radius:12px;padding:1.2vh 0;font-size:clamp(16px,3vh,28px);background:rgba(255,255,255,.12)}
.btns button.plus{background:var(--c);color:#0B0F19}
.lead::after{content:'🔥';position:absolute;right:10px;top:4vh;font-size:clamp(20px,4vh,40px)}
.foot{display:flex;justify-content:center;gap:10px;font-size:13px;color:#64748B}
.end{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,7,13,.85);z-index:5;text-align:center}
.end.on{display:grid}
.end div{font-size:clamp(40px,10vh,110px);color:#FDE047;animation:bump .5s ease}
.end small{display:block;font-size:.35em;color:#fff;margin-top:1vh}
.foot{flex-wrap:wrap;text-align:center}
@media (max-aspect-ratio:4/5){
  .teams{grid-template-columns:1fr;grid-template-rows:repeat(var(--n),minmax(0,1fr))}
  .team{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .tname{grid-column:1/-1}
  .score{font-size:min(16vh,calc(46vh / var(--n)))}
  .btns{grid-template-columns:repeat(2,1fr);align-content:center}
  .clockbox{flex-wrap:wrap;gap:8px}
  .clock{font-size:clamp(40px,9vh,90px)}
  .bar h1{display:none}.foot{display:none}
}
.maker{position:fixed;right:10px;bottom:4px;font-size:12px;color:rgba(255,255,255,.4)}
dialog{border:0;border-radius:16px;padding:18px;font-family:inherit}
dialog input{font-size:22px;width:4em;text-align:center;border-radius:8px;border:2px solid #ccc;padding:4px}
dialog button{border:0;border-radius:10px;padding:8px 14px;font-size:18px;margin:4px;background:#E5E7EB;color:#111}
dialog .pre{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
/* ── 새 디자인: 축구 중계 화면 (잔디 + 스코어 바 + 기울어진 패널) ── */
body{background:repeating-linear-gradient(90deg,#1f7a38 0 90px,#1a6e32 90px 180px);color:#fff}
.bar h1{color:#fff;text-shadow:0 3px 0 #0b3a1a;letter-spacing:.04em}
.bar span{color:#d6f5dd!important}
.tb{background:rgba(0,0,0,.35);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:6px}
.tb.on{background:#ffd60a;color:#102a43;border-color:#ffd60a}
.clockbox{background:linear-gradient(90deg,#0b1d3a,#12335f 50%,#0b1d3a);border:0;border-radius:6px;border-bottom:6px solid #ffd60a;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.clock{font-family:'Black Han Sans','Orbitron',monospace;font-weight:400;color:#fff;text-shadow:0 0 0 #0000;letter-spacing:.06em}
.clock.low{color:#ff5d5d;text-shadow:0 0 18px rgba(255,93,93,.7)}
.period{color:#ffd60a}.period b{font-family:'Black Han Sans',monospace;font-weight:400;color:#fff}
.cbtn{background:#ffd60a;color:#102a43;border-radius:6px}.cbtn.pause{background:#fff;color:#102a43}
.mini button{background:rgba(255,255,255,.15);color:#fff;border-radius:6px}
.ccol label{color:#cfe!important}
.team{background:#fff;border:0;border-radius:8px;border-top:14px solid var(--c);box-shadow:0 10px 0 rgba(0,0,0,.3);color:#102a43;transform:skewX(-3deg)}
.team>*{transform:skewX(3deg)}
.tname{background:#102a43;color:#fff;border-radius:0}
.score{font-family:'Black Han Sans','Orbitron',sans-serif;font-weight:400;color:#102a43;text-shadow:none;position:relative}
.btns button{background:#e8eef5;color:#102a43;border-bottom:4px solid #b9c6d6;border-radius:6px}
.btns button.plus{background:var(--c);color:#fff;border-bottom:4px solid rgba(0,0,0,.3)}
.lead::after{content:'📣'}
.foot{color:#d6f5dd}
.maker{color:rgba(255,255,255,.7)}
.end{background:rgba(11,29,58,.9)}.end div{color:#ffd60a}
.pop{position:fixed;pointer-events:none;z-index:40;font-family:'Black Han Sans',sans-serif;font-size:clamp(40px,9vh,110px);color:#ffd60a;text-shadow:0 4px 0 #0b1d3a,0 0 18px rgba(255,214,10,.7);animation:popup 1.1s ease-out forwards}
@keyframes popup{0%{transform:translateY(0) scale(.5);opacity:0}15%{transform:translateY(-10px) scale(1.3);opacity:1}100%{transform:translateY(-110px) scale(1);opacity:0}}
.goal{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:45;pointer-events:none;font-family:'Black Han Sans',sans-serif;font-size:clamp(60px,18vh,200px);color:#fff;text-shadow:0 6px 0 #e63946,0 0 30px rgba(255,255,255,.6);animation:goal 1.2s ease-out forwards}
@keyframes goal{0%{transform:scale(.3) rotate(-6deg);opacity:0}20%{transform:scale(1.15) rotate(2deg);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.streak{position:absolute;left:10px;top:4vh;background:#e63946;color:#fff;border-radius:999px;padding:2px 12px;font-size:clamp(14px,2.6vh,24px);z-index:3;animation:popup2 .6s ease}
@keyframes popup2{from{transform:scale(.3)}}

</style>
</head>
<body>
<div class="app">
  <div class="bar"><h1>🏟️ 전광판</h1><div class="sp"></div>
    <span style="font-size:14px;color:#94A3B8">팀 수</span><button class="tb" data-n="2">2</button><button class="tb" data-n="3">3</button><button class="tb" data-n="4">4</button>
    <button class="tb" id="swap">⇄ 자리 바꾸기</button><button class="tb" id="reset">↺ 점수 0</button><button class="tb" id="fs">⛶ 전체 화면</button></div>
  <div class="clockbox">
    <div class="period"><span>세트</span><b id="per">1</b><div class="mini"><button id="perM">−</button><button id="perP">+</button></div></div>
    <div class="clock" id="clock" title="눌러서 시간 정하기">05:00</div>
    <div class="ccol"><button class="cbtn" id="startBtn">▶ 시작</button><div class="mini"><button id="m1">−1분</button><button id="p1">+1분</button><button id="setT">⏱ 설정</button></div><label style="font-size:13px;color:#94A3B8"><input type="checkbox" id="up"> 올라가는 시계</label></div>
  </div>
  <div class="teams" id="teams"></div>
  <div class="foot">점수 숫자를 누르면 +1 · 키보드: Q/W/E/R 팀별 +1, 스페이스 시계 시작/멈춤</div>
</div>
<div class="end" id="end"><div>⏰ 경기 끝!<small id="endTxt"></small></div></div>
<dialog id="dlg"><div style="font-size:20px;margin-bottom:8px">경기 시간</div><input id="mm" type="number" min="0" max="99" value="5"> 분 <input id="ss" type="number" min="0" max="59" value="0"> 초
  <div class="pre" id="pre"></div><div style="text-align:right;margin-top:10px"><button id="ok" style="background:#22C55E;color:#fff">확인</button></div></dialog>
<div class="maker">제작 : 비춤이샘</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const C=['#EF4444','#3B82F6','#22C55E','#F59E0B'];
let N=2,teams=[{n:'빨강팀',s:0},{n:'파랑팀',s:0},{n:'초록팀',s:0},{n:'노랑팀',s:0}],cols=C.slice();
let total=300,left=300,run=false,last=0,up=false,ac=null,per=1;
try{const sv=JSON.parse(localStorage.getItem('bichum-score')||'null');if(sv){N=sv.N;teams=sv.teams;total=sv.total;left=sv.left;per=sv.per||1;}}catch(e){}
function save(){try{localStorage.setItem('bichum-score',JSON.stringify({N,teams,total,left,per}));}catch(e){}}
function beep(f,d,v=.2,type='square'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function buzzer(){[0,350,700].forEach(t=>setTimeout(()=>beep(220,.32,.25,'sawtooth'),t));}
function render(){
  const el=$('teams');el.style.setProperty('--n',N);
  const top=Math.max(...teams.slice(0,N).map(t=>t.s));
  el.innerHTML=teams.slice(0,N).map((t,i)=>`<div class="team${t.s===top&&top>0&&teams.slice(0,N).filter(x=>x.s===top).length===1?' lead':''}" style="--c:${cols[i]}"><input class="tname" data-i="${i}" value="${t.n}" maxlength="8" aria-label="팀 이름"><div class="score" data-i="${i}">${t.s}</div><div class="btns"><button data-i="${i}" data-d="-1">−1</button><button class="plus" data-i="${i}" data-d="1">+1</button><button class="plus" data-i="${i}" data-d="2">+2</button><button class="plus" data-i="${i}" data-d="3">+3</button></div></div>`).join('');
  document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',+b.dataset.n===N));
  $('per').textContent=per;
}
function add(i,d,bump=true){teams[i].s=Math.max(0,teams[i].s+d);save();render();if(bump){const s=document.querySelector(`.score[data-i="${i}"]`);s&&s.classList.add('bump');}beep(d>0?880:330,.08,.12,'sine');}
$('teams').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b){add(+b.dataset.i,+b.dataset.d);return;}const s=e.target.closest('.score');if(s)add(+s.dataset.i,1);});
$('teams').addEventListener('input',e=>{const t=e.target.closest('.tname');if(t){teams[+t.dataset.i].n=t.value;save();}});
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{N=+b.dataset.n;save();render();});
$('swap').onclick=()=>{const a=teams.slice(0,N).reverse(),c=cols.slice(0,N).reverse();teams.splice(0,N,...a);cols.splice(0,N,...c);render();};
$('reset').onclick=()=>{if(!confirm('점수를 모두 0으로 할까요?'))return;teams.forEach(t=>t.s=0);per=1;left=up?0:total;save();render();drawClock();};
$('perP').onclick=()=>{per++;save();render();};$('perM').onclick=()=>{per=Math.max(1,per-1);save();render();};
/* 시계 */
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function drawClock(){$('clock').textContent=fmt(left);$('clock').classList.toggle('low',!up&&run&&left<=10);}
function toggle(){
  if(!up&&left<=0){left=total;}
  run=!run;last=performance.now();$('startBtn').textContent=run?'⏸ 멈춤':'▶ 시작';$('startBtn').classList.toggle('pause',run);beep(run?660:440,.12,.15,'sine');
}
$('startBtn').onclick=toggle;
$('up').onchange=()=>{up=$('up').checked;run=false;left=up?0:total;$('startBtn').textContent='▶ 시작';$('startBtn').classList.remove('pause');drawClock();};
$('m1').onclick=()=>{left=Math.max(0,left-60);if(!run)total=Math.max(60,total-60);drawClock();save();};
$('p1').onclick=()=>{left+=60;if(!run)total+=60;drawClock();save();};
function openSet(){$('mm').value=Math.floor(total/60);$('ss').value=total%60;$('pre').innerHTML=[1,2,3,5,7,10,15,20].map(m=>`<button data-m="${m}">${m}분</button>`).join('');$('dlg').showModal();}
$('setT').onclick=openSet;$('clock').onclick=()=>{if(!run)openSet();};
$('pre').onclick=e=>{const b=e.target.closest('[data-m]');if(b){$('mm').value=b.dataset.m;$('ss').value=0;}};
$('ok').onclick=()=>{total=Math.max(5,(+$('mm').value||0)*60+(+$('ss').value||0));left=up?0:total;drawClock();save();$('dlg').close();};
let lastSec=-1;
function tick(t){
  if(run){const dt=(t-last)/1000;last=t;
    if(up)left+=dt;else{left-=dt;const s=Math.ceil(left);if(s<=5&&s>0&&s!==lastSec){lastSec=s;beep(1000,.1,.15,'sine');}
      if(left<=0){left=0;run=false;$('startBtn').textContent='▶ 시작';$('startBtn').classList.remove('pause');buzzer();
        const sc=teams.slice(0,N),top=Math.max(...sc.map(x=>x.s)),w=sc.filter(x=>x.s===top);
        $('endTxt').textContent=w.length>1?`${w.map(x=>x.n).join(', ')} 무승부! (${top}점)`:`🏆 ${w[0].n} 승리! (${sc.map(x=>x.s).join(' : ')})`;$('end').classList.add('on');}}
    drawClock();save();}
  requestAnimationFrame(tick);
}
$('end').onclick=()=>$('end').classList.remove('on');
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k='qwer'.indexOf(e.key.toLowerCase());if(k>=0&&k<N){add(k,1);}else if(e.code==='Space'){e.preventDefault();toggle();}});
render();drawClock();requestAnimationFrame(tick);
})();
</script>
<script>
let __ac;function beep(f,d,t='sine',v=.05){try{__ac=__ac||new(window.AudioContext||window.webkitAudioContext)();const o=__ac.createOscillator(),g=__ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,__ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,__ac.currentTime+d);o.connect(g);g.connect(__ac.destination);o.start();o.stop(__ac.currentTime+d);}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*100));}
function confetti(n=140,ox=.5,oy=.6){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const g=c.getContext('2d');const ps=Array.from({length:n},()=>({x:c.width*ox,y:c.height*oy,vx:(Math.random()-.5)*16,vy:-Math.random()*17-4,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6+3,a:Math.random()*6}));let t=0;(function f(){t++;g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.a+=.2;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore();});if(t<120)requestAnimationFrame(f);else c.remove();})();}

(function(){
const $=id=>document.getElementById(id);
let prev=null,lastTeam=-1,run=0;
function cheer(n){const o=[523,659,784,988,1175];beep(o[Math.min(4,n)],.14,'triangle',.08);setTimeout(()=>beep(o[Math.min(4,n)]*1.5,.16,'triangle',.07),110);}
function scan(){const els=[...document.querySelectorAll('#teams .score')];const cur=els.map(e=>+e.textContent||0);
  if(prev&&prev.length===cur.length){cur.forEach((v,i)=>{const d=v-prev[i];if(d>0){const r=els[i].getBoundingClientRect();const p=document.createElement('div');p.className='pop';p.textContent='+'+d;p.style.left=(r.left+r.width/2-40)+'px';p.style.top=(r.top+r.height*.3)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1150);cheer(d);
      if(d>=2){const g=document.createElement('div');g.className='goal';g.textContent=d>=3?'GOAL! ⚽':'NICE!';document.body.appendChild(g);setTimeout(()=>g.remove(),1250);confetti(70,(r.left+r.width/2)/innerWidth,(r.top+r.height/2)/innerHeight);}
      run=(lastTeam===i)?run+1:1;lastTeam=i;
      if(run>=3){const t=els[i].closest('.team');if(t&&!t.querySelector('.streak')){t.insertAdjacentHTML('beforeend','<div class="streak">🔥 '+run+'연속 득점!</div>');setTimeout(()=>{const s=t.querySelector('.streak');s&&s.remove();},2500);}beep(1320,.1,'square',.05);}
    }});}
  prev=cur;}
new MutationObserver(()=>scan()).observe($('teams'),{childList:true,subtree:true,characterData:true});
$('reset').addEventListener('click',()=>{lastTeam=-1;run=0;setTimeout(()=>{prev=null;scan();},50);});
document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>{prev=null;setTimeout(scan,50);}));
scan();
new MutationObserver(()=>{if($('end').classList.contains('on')){fanfare();confetti(200,.5,.5);}}).observe($('end'),{attributes:true,attributeFilter:['class']});
})();

</script>
</body>
</html>

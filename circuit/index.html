<!doctype html>
<html lang="ko">
<head>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<meta charset="utf-8">
<meta name="theme-color" content="#070d1f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>정전 마을 전기 기사 | 비춤이샘 수업용 게임</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');
/* 글꼴을 못 불러올 때(오프라인)도 굵은 간판 글씨가 나오게 */
@font-face{font-family:'DH-fb';src:local('Noto Sans CJK KR Black'),local('NotoSansCJKkr-Black'),local('Noto Sans KR Black'),local('Malgun Gothic Bold'),local('AppleSDGothicNeo-Heavy');}
/* =========================================================
   정전 마을 전기 기사 · "밤의 배전반"
   남색 밤하늘 + 청사진 모눈 + 전기 노랑 · 구리 전선 · 차단기 스위치
   ========================================================= */
:root{
  --bg:#070d1f; --bg2:#0c1530; --deep:#050a18;
  --panel:#111b3a; --panel2:#18264f; --panel3:#213264; --rim:#35498f; --rim2:#4b63b5;
  --volt:#ffd23f; --volt2:#ffae1a; --cyan:#3ee6ff; --mint:#3df0b8; --copper:#e58a3a; --paper:#f5f1e6;
  --ink:#0b1430; --sub:#9db0e6; --line:#2d4082; --c1:#ffd23f; --c2:#3ee6ff;
  --ok:#3df0b8; --bad:#ff5a7a;
  --p1:#4da3ff; --p2:#ff5c7a; --p3:#3fe08a; --p4:#c08bff;
  --sans:'IBM Plex Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --disp:'Do Hyeon','DH-fb','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --grid:linear-gradient(#ffffff07 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#ffffff07 1px,transparent 1px) 0 0/40px 40px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:#e8eeff;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:radial-gradient(1000px 520px at 80% -8%,#1d3a8a55,transparent 62%),radial-gradient(800px 480px at -8% 108%,#0e6b6a40,transparent 60%),var(--grid),var(--bg)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
h1,h2,h3,.big,.jua{font-family:var(--disp);font-weight:400}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
img.emj{width:1.18em;height:1.18em;vertical-align:-.24em;display:inline-block;object-fit:contain;pointer-events:none}
svg.logo{display:block;width:100%;height:100%}

/* ---------- 설정 화면: 왼쪽 마을 풍경 + 오른쪽 배전반 ---------- */
#setup{flex-direction:row}
.topbar-mini{position:fixed;top:12px;right:14px;display:flex;gap:8px;z-index:5}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;height:44px;min-width:44px;padding:0 14px;border-radius:12px;
  background:var(--panel3);color:#e8eeff;font-family:var(--disp);font-size:17px;white-space:nowrap;box-shadow:inset 0 0 0 2px var(--rim),0 3px 0 #02050f;transition:background .12s}
.icon-btn:hover{background:#2c4180}
.icon-btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--rim),0 1px 0 #02050f}
.icon-btn.ico{padding:0}
.booth{position:relative;flex:0 0 46%;min-width:0;height:100%;overflow:hidden;background:var(--deep)}
.booth canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sign{position:absolute;left:50%;top:clamp(14px,3.2vh,32px);transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none}
.sign .sub{display:inline-block;font:700 14px/1 var(--sans);color:var(--ink);background:var(--volt);border-radius:6px;padding:6px 12px;margin-bottom:10px;letter-spacing:.02em;box-shadow:0 0 0 2px #0b1430,0 0 20px #ffd23f77}
.sign h1{margin:0;font-size:clamp(38px,5vw,74px);line-height:1.02}
.sign h1 .l1{display:block;color:#e6fbff;text-shadow:0 0 5px #fff,0 0 14px var(--cyan),0 0 34px #2a8dff,0 0 64px #2563eb;animation:flick 6s infinite}
.sign h1 .l2{display:block;color:#fff6c4;text-shadow:0 0 5px #fff,0 0 14px var(--volt),0 0 34px var(--volt2),0 0 64px #f59e0b}
@keyframes flick{0%,62%,66%,70%,100%{opacity:1}64%,68%{opacity:.25}93%{opacity:.6}95%{opacity:1}}
.booth-how{position:absolute;left:0;right:0;bottom:0;padding:44px clamp(16px,4%,34px) clamp(14px,3vh,26px);font-size:clamp(13px,1.15vw,15.5px);line-height:1.65;color:#d6e0ff;word-break:keep-all;
  background:linear-gradient(transparent,#050a18d9 55%);text-shadow:0 1px 2px #000a}
.booth-how b{color:var(--volt)}
.counter-col{flex:1;min-width:0;height:100%;overflow-y:auto;padding:24px clamp(16px,3.4vw,44px) 26px;
  background:linear-gradient(90deg,#0000008c,transparent 26px),var(--grid),linear-gradient(#0e1838f2,#0a1230f8)}
.form{max-width:640px;margin:0 auto}
.stn{padding:12px 0 14px;border-bottom:1px dashed #ffffff1f}
.stn:first-child{padding-top:4px}
.stn-h{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.stn-h h2{margin:0;font-family:var(--sans);font-weight:700;font-size:18px;color:#fff;letter-spacing:.01em}
.lamp{position:relative;flex:0 0 auto;width:36px;height:19px;border-radius:10px;background:#050a1a;box-shadow:inset 0 0 0 2px var(--rim),inset 0 3px 5px #000a;transition:background .2s}
.lamp::after{content:'';position:absolute;left:3px;top:3px;width:13px;height:13px;border-radius:50%;background:linear-gradient(#8aa0e0,#566ab0);transition:transform .2s,background .2s,box-shadow .2s}
.stn.done .lamp{background:#3b2f06}
.stn.done .lamp::after{transform:translateX(17px);background:radial-gradient(circle at 35% 30%,#fff7cf,var(--volt) 50%,var(--volt2));box-shadow:0 0 12px var(--volt)}
.needmsg{display:none;font:700 12.5px/1 var(--sans);font-style:normal;color:#fff;background:var(--bad);border-radius:6px;padding:4px 8px}
.stn.need .lamp{box-shadow:inset 0 0 0 2px var(--bad),0 0 12px var(--bad);animation:blink .5s steps(2) 5}
.stn.need .needmsg{display:inline-block}
.stn.need{animation:needshake .35s}
@keyframes blink{50%{opacity:.35}}
@keyframes needshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.duo{border-bottom:1px dashed #ffffff1f}
.duo .stn{border-bottom:none}
.chips{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.chips.lv{grid-template-columns:1fr 1fr}
.chips.md{grid-template-columns:repeat(3,1fr)}
.chips.tm{grid-template-columns:repeat(3,1fr)}
.grade-group .gl{font:600 13px var(--sans);color:var(--sub);margin:0 0 8px}
.chip{position:relative;display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;padding:8px 13px;border:none;border-radius:12px;
  background:var(--panel3);color:#eaf0ff;font-family:var(--sans);font-weight:700;font-size:16.5px;line-height:1.2;word-break:keep-all;
  box-shadow:inset 0 0 0 2px var(--rim),0 4px 0 #02050f;transition:transform .1s,background .12s,box-shadow .12s}
.chip>span{min-width:0}
.chip small{display:block;font:500 12.5px/1.35 var(--sans);color:#a9bbee;margin-top:3px}
.chip:hover{background:#2c4180}
.chip:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--rim),0 1px 0 #02050f}
.chip.sel{background:linear-gradient(#ffe48a,#ffc531);color:var(--ink);box-shadow:inset 0 0 0 2px #fff3c4,0 4px 0 #a86a0c,0 0 24px #ffd23f55}
.chip.sel small{color:#6b4309}
.chip svg{flex:0 0 auto;width:38px;height:38px}
.chips.md .chip{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:10px 8px}
.chips.md .chip svg{width:34px;height:34px}
.chips.tm .chip{justify-content:center;text-align:center;white-space:nowrap}
.nick-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.nick-row .dot{flex:0 0 auto;width:10px;height:36px;border-radius:4px}
.nick-row input{flex:1;min-width:0;max-width:380px;font-family:var(--sans);font-weight:700;font-size:18px;padding:11px 14px;border-radius:10px;border:none;outline:none;
  background:var(--paper);color:var(--ink);box-shadow:inset 0 3px 0 #0b143022}
.nick-row input::placeholder{color:#8e98b5}
.nick-row input:focus{box-shadow:0 0 0 3px var(--volt)}
.dice{flex:0 0 auto;width:50px;height:50px;border:none;border-radius:12px;background:var(--panel3);box-shadow:inset 0 0 0 2px var(--rim),0 4px 0 #02050f;font-size:24px;display:grid;place-items:center;transition:transform .15s}
.dice:active{transform:rotate(25deg) scale(.92)}
.dice img.emj{width:28px;height:28px;vertical-align:0}
.hint{color:var(--sub);font-size:13.5px;line-height:1.55;margin-top:8px;word-break:keep-all}
.hint b{color:#fff}
.fire{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin:20px 0 0;padding:15px 20px;border:none;border-radius:16px;
  font-family:var(--disp);font-size:30px;color:var(--ink);background:linear-gradient(#ffe685,#ffb92b);
  box-shadow:0 6px 0 #a86a0c,0 16px 34px #ffb02e55,inset 0 2px 0 #ffffffaa;transition:transform .08s,box-shadow .08s}
.fire svg{width:32px;height:32px}
.fire:hover{filter:brightness(1.06)}
.fire:active{transform:translateY(4px);box-shadow:0 2px 0 #a86a0c,inset 0 2px 0 #ffffffaa}
.maker{text-align:center;color:#7f93cc;font-size:13px;margin-top:20px;letter-spacing:.02em}
/* 각자 기기 대결(설정 화면 안) */
.nl-role{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.nl-chk{color:#eaf0ff}
.nl-join b{color:#fff}
.nl-role .chip{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}

/* ---------- 플레이 화면 ---------- */
.pbar{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 12px 10px;min-height:64px;background:linear-gradient(#17244d,#0d1633);box-shadow:0 3px 0 #02050f}
.pbar::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:5px;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--volt) 0 7px,#ffd23f00 7px 34px);background-size:34px 100%;animation:flow 1.1s linear infinite;filter:drop-shadow(0 0 4px var(--volt))}
@keyframes flow{to{background-position:34px 0}}
@media (prefers-reduced-motion:reduce){.pbar::after,.sign h1 .l1{animation:none}}
.clock{--f:1;position:relative;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px 0 5px;border-radius:999px;background:var(--deep);flex:0 0 auto;box-shadow:inset 0 0 0 2px var(--rim)}
.clock .ring{width:36px;height:36px;border-radius:50%;background:conic-gradient(var(--volt) calc(var(--f)*360deg),#2a3a76 0);
  -webkit-mask:radial-gradient(circle,transparent 9px,#000 10px),repeating-conic-gradient(#000 0 22deg,transparent 22deg 30deg);-webkit-mask-composite:source-in;
  mask:radial-gradient(circle,transparent 9px,#000 10px),repeating-conic-gradient(#000 0 22deg,transparent 22deg 30deg);mask-composite:intersect}
.clock b{font-family:var(--disp);font-weight:400;font-size:28px;color:var(--volt);letter-spacing:.02em;min-width:2.6em;font-variant-numeric:tabular-nums;text-shadow:0 0 10px #ffd23f66}
.clock.hurry b{color:#ff8aa3;text-shadow:0 0 10px #ff5a7a88}
.clock.hurry .ring{background:conic-gradient(var(--bad) calc(var(--f)*360deg),#2a3a76 0)}
.clock.hurry{animation:hurry .9s infinite}
@keyframes hurry{50%{transform:scale(1.05)}}
.ptitle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 4px}
.ptitle .pe{flex:0 0 auto;line-height:0;width:36px;height:36px}
.ptitle .pt{min-width:0;display:flex;align-items:baseline;gap:10px}
.ptitle .pt b{font-family:var(--disp);font-weight:400;font-size:25px;color:#fff;white-space:nowrap;text-shadow:0 2px 0 #02050f}
.ptitle .pt small{font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.quit{padding:0 16px}
.arena{flex:1;display:flex;min-height:0}
.arena.solo{padding:12px 12px 0}
.panel{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;background:var(--deep);overflow:hidden;container-type:inline-size;container-name:panel}
.panel+.panel{border-left:4px solid #02050f;box-shadow:inset 2px 0 0 #ffd23f40}
.arena.solo .panel{max-width:1100px;margin:0 auto;border-radius:16px 16px 0 0;box-shadow:0 0 0 4px #02050f,0 0 50px #000a}
.phead{display:flex;align-items:center;gap:8px;padding:0 8px 0 0;min-height:42px;background:#0d1633;border-bottom:2px solid #02050f}
.phead .no{flex:0 0 auto;align-self:stretch;display:grid;place-items:center;width:40px;padding-right:6px;background:var(--pc);color:#fff;font-family:var(--disp);font-size:19px;clip-path:polygon(0 0,100% 0,76% 50%,100% 100%,0 100%);text-shadow:0 1px 0 #0006}
.phead .nm{font-family:var(--disp);font-size:clamp(15px,4.8cqw,21px);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.phead .tm{display:none}
.phead .sc{font-family:var(--disp);font-size:clamp(18px,6cqw,26px);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--volt);
  background:#02050f;padding:5px 12px 4px;border-radius:6px;box-shadow:inset 0 0 0 2px #2b3c78,0 0 14px #ffd23f22;text-shadow:0 0 10px #ffd23f99}
.phead .sc small{font-size:.55em;color:#c9a23a;margin-left:2px}
.phead .sc.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.22) rotate(-3deg)}}
.prog{height:5px;position:relative;background:#02050f}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cyan),var(--volt));transition:width .3s linear;box-shadow:0 0 8px var(--volt)}
.stage{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
/* 작업 지시서: 노랑·검정 경고띠가 붙은 종이 */
.qbox.ask{position:relative;z-index:2;min-height:clamp(48px,11cqw,70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:6px 14px 7px 26px;background:linear-gradient(#fbf8ee,#efe8d4);color:var(--ink);font-family:var(--disp);font-size:clamp(16px,5.2cqw,29px);line-height:1.25;word-break:keep-all;
  border-bottom:3px solid #b8892a;box-shadow:0 4px 0 #02050f66;transform-origin:50% 0}
.qbox.ask::before{content:'';position:absolute;left:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(-45deg,#111 0 7px,var(--volt) 7px 14px)}
.qbox.ask b{font-weight:400;color:#c2410c}
.qbox.ask.flash{animation:signflip .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes signflip{0%{transform:perspective(500px) rotateX(-70deg)}100%{transform:none}}
.qbox.ask .s{display:block;font:500 clamp(11px,3.3cqw,14px)/1.3 var(--sans);color:#6b5a2e;margin-top:2px}
.cvwrap{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;touch-action:none;background:var(--deep)}
.cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tip{position:absolute;left:50%;bottom:8px;z-index:6;width:max-content;max-width:calc(100% - 16px);background:#0a1230f5;color:#f2f5ff;border-radius:12px;padding:8px 14px;
  font:500 clamp(13px,3.9cqw,17px)/1.45 var(--sans);text-align:center;word-break:keep-all;pointer-events:none;opacity:0;transform:translate(-50%,12px);
  transition:.22s cubic-bezier(.2,.9,.3,1.3);box-shadow:0 0 0 2px #ffd23f66,0 12px 26px #000a}
.tip b{color:var(--volt);font-weight:700}
.tip.on{opacity:1;transform:translate(-50%,0)}
.tip.bad{box-shadow:0 0 0 2px var(--bad),0 12px 26px #000a}
.tip.good{box-shadow:0 0 0 2px var(--mint),0 12px 26px #000a}
.streak{position:absolute;top:10px;right:8px;z-index:4;font-family:var(--disp);font-size:clamp(14px,4.4cqw,19px);color:var(--ink);
  background:linear-gradient(#ffe48a,#ffc531);border-radius:8px;padding:4px 10px;box-shadow:0 0 18px #ffd23f88;opacity:0;transform:scale(.6) rotate(-6deg);transition:.2s;pointer-events:none}
.streak.on{opacity:1;transform:rotate(-3deg)}
.ctrl.tools{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px;background:#0a1230;border-top:2px solid #02050f}
.ctrl.tools:empty{display:none}
.toolbtn{font-family:var(--disp);font-size:clamp(14px,4.5cqw,22px);min-height:clamp(46px,12cqw,62px);flex:1 1 0;min-width:0;border-radius:12px;border:none;background:var(--panel3);color:#eaf0ff;
  box-shadow:inset 0 0 0 2px var(--rim),0 4px 0 #02050f;padding:4px 6px;line-height:1.15;word-break:keep-all;transition:transform .08s,box-shadow .08s,background .12s}
.toolbtn:hover{background:#2c4180}
.toolbtn:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--rim),0 1px 0 #02050f}
.toolbtn.sel{background:linear-gradient(#ffe48a,#ffc531);color:var(--ink)}
.toolbtn.go{background:linear-gradient(#ffe48a,#ffc531);color:var(--ink);box-shadow:inset 0 0 0 2px #fff3c4,0 4px 0 #a86a0c}
.toolbtn.on{background:linear-gradient(#7ff6d8,#2fd1a4);color:#04251c;box-shadow:inset 0 0 0 2px #c9fff0,0 4px 0 #0b6b52}
.toolbtn:disabled,.toolbtn.off{opacity:.45}
.toolbtn .e{display:block;font-size:1.3em;line-height:1.1;margin-bottom:1px}
.toolbtn small{display:block;font:500 .62em/1.1 var(--sans);opacity:.8;margin-top:1px}
.toolbtn .e img.emj{width:1.25em;height:1.25em;vertical-align:0}

/* 시작 전 안내와 3·2·1 */
.howcard{position:absolute;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;padding:12px;background:#050a18d6;backdrop-filter:blur(5px)}
.howcard .in{position:relative;background:linear-gradient(#17244d,#0e1737);border-radius:20px;padding:26px 22px 18px;max-width:440px;width:100%;text-align:center;box-shadow:inset 0 0 0 2px var(--rim),0 20px 50px #000c;overflow:hidden}
.howcard .in::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,#111 0 8px,var(--volt) 8px 16px)}
.howcard .e{width:clamp(44px,13cqw,68px);height:clamp(44px,13cqw,68px);margin:0 auto;line-height:0;filter:drop-shadow(0 0 14px #ffd23f88)}
.howcard .t{font-family:var(--disp);font-size:clamp(20px,6.4cqw,30px);color:#fff;margin-top:6px}
.howcard .d{font-size:clamp(13px,4cqw,17px);line-height:1.6;margin-top:6px;color:#cbd7fb;word-break:keep-all}
.howcard .d b{color:var(--volt)}
.howcard .num{font-family:var(--disp);font-size:clamp(48px,18cqw,100px);line-height:1;margin-top:10px;color:var(--volt);text-shadow:0 0 22px #ffd23faa}
.howcard .num.go{animation:cd .9s ease-out}
@keyframes cd{0%{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}}
.done-cover{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;
  background:#050a18e6;backdrop-filter:blur(6px);color:#fff}
.done-cover.on{display:flex;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.done-cover .big{font-size:clamp(28px,10cqw,50px);color:var(--volt);text-shadow:0 0 22px #ffd23f88}
.done-cover .s2{font-size:clamp(14px,4.6cqw,20px);color:#cbd7fb}
.done-cover .sc2{font-family:var(--disp);color:#fff;font-size:clamp(18px,6cqw,26px)}
.done-cover .sc2 b{font-weight:400;font-size:2.2em;color:var(--volt);margin-right:4px;text-shadow:0 0 16px #ffd23f88}
.panel.golden{box-shadow:0 0 0 4px var(--volt),0 0 24px #ffd23faa}

/* ---------- 결과 화면 ---------- */
#result{overflow-y:auto;align-items:center;padding:30px 16px 40px}
.res-wrap{width:min(1000px,100%)}
.res-title{text-align:center;font-family:var(--disp);font-size:clamp(34px,5.2vw,58px);color:#fff6c4;margin:4px 0 8px;text-shadow:0 0 6px #fff,0 0 16px var(--volt),0 0 38px var(--volt2)}
.room-note{text-align:center;color:#cbd7fb;background:#ffffff10;border:1px solid #ffffff1c;border-radius:999px;padding:8px 18px;margin:0 auto 18px;max-width:600px;font-size:15px}
.room-note b{color:#fff}
.podium{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-end}
.pcard{position:relative;flex:1 1 200px;max-width:280px;background:linear-gradient(#17244d,#0e1737);border-radius:18px;padding:20px 14px 16px;text-align:center;box-shadow:inset 0 0 0 2px var(--rim),0 16px 40px #0008;overflow:hidden}
.pcard::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:var(--pc)}
.pcard .rk{font-size:46px;line-height:1.1}
.pcard .rk img.emj{width:58px;height:58px;vertical-align:0;filter:drop-shadow(0 6px 8px #0006)}
.pcard .nm{font-family:var(--disp);font-size:24px;color:var(--pc);margin-top:8px;filter:brightness(1.25)}
.pcard .pts{font-family:var(--disp);font-size:44px;color:#fff;line-height:1.15;text-shadow:0 0 14px #ffd23f55}
.pcard .st{color:var(--sub);font-size:14px}
.review{background:linear-gradient(#17244d,#0e1737);border-radius:16px;padding:16px 20px;margin-top:16px;box-shadow:inset 0 0 0 2px var(--rim),0 10px 30px #0006;line-height:1.6;color:#dbe4ff}
.review h3{margin:0 0 8px;font-size:21px;color:#fff}
.review details{margin:6px 0}
.review summary{font-family:var(--disp);font-size:18px;cursor:pointer}
.review ul{padding-left:20px;margin:6px 0}
.review li{margin:5px 0}
.review li b{color:var(--volt)}
.res-btns{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.res-btns button{font-family:var(--disp);font-size:23px;padding:14px 34px;border:none;border-radius:14px;color:var(--ink);background:linear-gradient(#ffe685,#ffb92b);box-shadow:0 5px 0 #a86a0c,0 12px 26px #ffb02e44}
.res-btns button.sub{background:var(--panel3);color:#fff;box-shadow:inset 0 0 0 2px var(--rim),0 5px 0 #02050f}

/* ---------- 각자 기기 대결 (방 만들기·대기실·점수판) ---------- */
body .nl-card{background:linear-gradient(#17244d,#0e1737);color:#e8eeff;border:none;border-radius:20px;box-shadow:inset 0 0 0 2px var(--rim),0 20px 50px #000a}
body .nl-tag{font-family:var(--disp);background:var(--volt);color:var(--ink)}
body .nl-card h2{font-family:var(--disp);color:#fff}
body .nl-card h2 svg{display:inline-block;width:1em;height:1em;vertical-align:-.12em}
body .nl-code{font-family:var(--disp);border:3px dashed var(--volt);background:#060c20;color:var(--volt);border-radius:16px;text-shadow:0 0 14px #ffd23f88}
body .nl-set,body .nl-hint{color:var(--sub)}
body .nl-p{font-family:var(--disp);border:2px solid var(--line);background:#0b1431;color:#eaf0ff}
body .nl-p.me{border-color:var(--volt);background:#1a2650}
body .nl-p.empty{color:#4a5b94}
body .nl-p .bd{font-family:var(--sans);color:var(--sub)}
body .nl-p .bar{background:#050a18}
body .nl-btns button{font-family:var(--disp);border-radius:14px;color:var(--ink);background:linear-gradient(#ffe685,#ffb92b);box-shadow:0 5px 0 #a86a0c}
body .nl-btns button.sub{background:var(--panel3);color:#fff;border:none;box-shadow:inset 0 0 0 2px var(--rim),0 4px 0 #02050f}
body .nl-join input,body .room input{font-family:var(--disp);border:3px solid var(--line);border-radius:12px;background:#060c20;color:#fff}
body .nl-join input:focus{outline:none;border-color:var(--volt)}
body .nl-chk input{accent-color:var(--volt)}
body .netstrip{background:#0d1633;border-bottom:2px solid #02050f}
body .netstrip .ch{font-family:var(--disp);background:var(--panel3);color:#eaf0ff;border:1px solid var(--rim)}
body .netstrip .ch.me{background:#3b2f06;border-color:var(--volt);color:#fff}
body .netstrip .lb{color:var(--sub)}
body .netstrip .endall{background:transparent;color:#ff9db0;border-color:var(--bad)}
body #netboard .nl-card,body #lobby .nl-card{background:linear-gradient(#17244d,#0e1737)}

@media (max-width:860px){
  #setup{flex-direction:column;overflow-y:auto}
  .booth{flex:0 0 auto;width:100%;height:clamp(220px,40vh,340px)}
  .booth-how{display:none}
  .counter-col{height:auto;overflow:visible;flex:0 0 auto;padding:18px 14px 26px}
  .chips.md{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:640px){
  .pbar{gap:6px;padding:8px;min-height:60px}
  .clock{height:44px;padding:0 10px 0 5px;gap:6px}
  .clock b{font-size:24px}
  .ptitle{height:44px;padding:0 4px}
  .ptitle .pt small{display:none}
  .ptitle .pt b{font-size:18px;overflow:hidden;text-overflow:ellipsis}
  .ptitle .pe{width:28px;height:28px}
  .icon-btn{height:44px;min-width:40px;font-size:15px}
  .icon-btn.ico{display:none}
  .icon-btn.quit{padding:0 10px}
  .arena.solo{padding:6px 6px 0}
  .chips.lv{grid-template-columns:1fr}
  .chips.md .chip small{display:none}
}
@media (max-width:900px){.ptitle .pt small{display:none}}

/* 크롬북·낮은 가로 화면: 위쪽 띠를 줄여 놀이판을 더 넓게 */
@media (max-height:720px){
  .pbar{padding:6px 10px 8px;min-height:52px;gap:8px}
  .clock,.ptitle{height:40px}
  .clock b{font-size:25px}
  .clock .ring{width:30px;height:30px}
  .ptitle .pe{width:30px;height:30px}
  .ptitle .pt b{font-size:21px}
  .icon-btn{height:40px;min-width:40px}
  .arena.solo{padding:6px 6px 0}
  .phead{min-height:36px}
  .qbox.ask{min-height:0;padding:3px 10px 4px 24px;font-size:clamp(15px,min(5.4cqw,3.8vh),26px);line-height:1.2}
  .qbox.ask .s{font-size:clamp(11px,min(3.3cqw,2.5vh),14px);margin-top:0}
  .ctrl.tools{padding:6px;gap:6px}
  .toolbtn{min-height:clamp(40px,8.5vh,56px);border-radius:10px}
  .toolbtn .e{font-size:1.2em;margin-bottom:0}
}
/* 4인 한 화면 좁은 칸: 도구 버튼이 많으면 두 줄로 */
@container panel (max-width:300px){
  .ctrl.tools:has(.toolbtn:nth-child(3)){display:grid;grid-template-columns:1fr 1fr}
  .ctrl.tools:has(.toolbtn:nth-child(3)) .toolbtn{min-height:44px;font-size:clamp(13px,5cqw,17px)}
}
@container panel (max-width:200px){
  .ctrl.tools:has(.toolbtn:nth-child(3)) .toolbtn{min-height:42px;font-size:clamp(12px,8.5cqw,16px)}
}

</style>

      peer.on('connection',c=>this.hostConn(c));
      peer.on('error',err=>{this.lastErr=err.type;if(!opened){retry(err.type==='unavailable-id'?'id':'net');return;}
        if(['network','server-error','socket-error','socket-closed'].includes(err.type)){try{if(!peer.destroyed)peer.reconnect();}catch(e){}}});
      peer.on('disconnected',()=>{try{if(!peer.destroyed)peer.reconnect();}catch(e){}});};
    tryHost(0);
  },
  hostConn(conn){
    conn.on('data',msg=>{if(!msg||!this.on)return;const p=this.roster.find(x=>x.id===conn.peer);if(p)p.seen=Date.now();
      if(msg.t==='hello'){
        if(this.started&&!this.final){conn.send({t:'deny',why:'이미 게임이 시작됐어요. 끝난 뒤에 다시 들어와 주세요.'});setTimeout(()=>conn.close(),400);return;}
        if(this.roster.filter(x=>!x.left).length>=MAX){conn.send({t:'deny',why:`방이 가득 찼어요 (최대 ${MAX}명).`});setTimeout(()=>conn.close(),400);return;}
        let nick=String(msg.nick||'친구').slice(0,10);if(this.roster.some(x=>x.nick===nick))nick=nick+'2';
        this.roster=this.roster.filter(x=>!x.left);
        this.roster.push(this.entry(conn.peer,nick));this.conns.push(conn);
        conn.send({t:'welcome',you:conn.peer,code:this.code,roster:this.roster,set:this.set});
        this.bcast({t:'lobby',roster:this.roster,set:this.set});this.showLobby();Snd.tone(660,.08,'sine',.05);return;}
      if(msg.t==='sc'&&p){Object.assign(p,{score:msg.score,prog:msg.prog,done:msg.done,k2:msg.k2,k3:msg.k3,line:msg.line});this.boardSync();this.checkDone();return;}
      if(msg.t==='bye'){this.drop(conn.peer);}});
    conn.on('close',()=>{if(this.on&&this.role==='host')this.drop(conn.peer);});
  },
  drop(id){const p=this.roster.find(x=>x.id===id);this.conns.filter(c=>c.peer===id).forEach(c=>{try{c.close();}catch(e){}});this.conns=this.conns.filter(c=>c.peer!==id);
    if(!p||p.left)return;p.left=true;
    if(!this.started||this.final){this.roster=this.roster.filter(x=>x!==p);this.bcast({t:'lobby',roster:this.roster,set:this.set});if($('#lobby').classList.contains('on'))this.showLobby();}
    else{this.boardSync();this.checkDone();}},
  bcast(m){if(this.role!=='host')return;this.conns.forEach(c=>{try{if(c.open)c.send(m);}catch(e){}});},

  join(cfg){
    const code=cfg.joinCode;let done=false,tries=0,peer=null,tm=0;
    const fail=t=>{if(done)return;done=true;clearTimeout(tm);try{peer&&peer.destroy();}catch(e){}this.on=false;this.say(t);};
    Object.assign(this,{role:'guest',peer:null,code,roster:[],myId:null,watch:false,started:false,final:false,gone:false,myNick:cfg.nicks[0]});
    const attempt=()=>{if(done)return;clearTimeout(tm);try{peer&&peer.destroy();}catch(e){}
      const pr=new Peer(undefined,this.opts());peer=pr;this.peer=pr;
      const again=msg=>{if(done||pr!==peer)return;if(++tries<=3){this.say('연결하는 중… ('+(tries+1)+'번째 시도)',true);try{pr.destroy();}catch(e){}clearTimeout(tm);setTimeout(attempt,1000*tries);}else fail(msg);};
      tm=setTimeout(()=>again('방을 찾지 못했어요. 방 코드를 확인하고, 방장 화면이 켜져 있는지 봐 주세요.'),12000);
      pr.on('open',()=>{if(pr!==peer)return;const conn=pr.connect(this.prefix()+code,{reliable:true});this.conn=conn;
        conn.on('open',()=>conn.send({t:'hello',nick:cfg.nicks[0]}));
        conn.on('data',msg=>{if(!msg)return;this.lastHost=Date.now();
          if(msg.t==='deny'){fail(msg.why);return;}
          if(msg.t==='welcome'){done=true;clearTimeout(tm);this.on=true;this.myId=msg.you;this.roster=msg.roster;this.set=msg.set;this.say('');this.showLobby();
            this.every(3000,()=>{try{conn.send({t:'hb'});}catch(e){}if(Date.now()-this.lastHost>30000)this.hostLost();});return;}
          if(msg.t==='lobby'){this.roster=msg.roster;this.set=msg.set;if(!this.started||this.final){this.started=false;this.showLobby();}return;}
          if(msg.t==='start'){this.begin(msg);return;}
          if(msg.t==='board'){this.mergeBoard(msg.roster);this.renderLive();return;}
          if(msg.t==='final'){this.roster=msg.roster;this.finalize();return;}
          if(msg.t==='close'){this.hostLost(true);}});
        conn.on('close',()=>{if(this.on&&this.role==='guest')this.hostLost();});});
      pr.on('error',err=>{if(done||pr!==peer)return;if(err.type==='peer-unavailable')again('그 방 코드는 없어요. 방 코드를 다시 확인해 주세요.');else again('연결하지 못했어요. 잠시 뒤에 다시 눌러 주세요. (오류: '+err.type+')');});};
    attempt();
  },
  mergeBoard(r){const mine=this.me();this.roster=r;if(mine){const m=this.me();if(m)Object.assign(m,{score:mine.score,prog:mine.prog,done:mine.done,k2:mine.k2,k3:mine.k3,line:mine.line});}},
  hostLost(closed){if(this.gone||!this.on)return;this.gone=true;
    const lobbyOn=$('#lobby').classList.contains('on');
    if(lobbyOn||!this.started){alert(closed?'방장이 방을 닫았어요.':'방장과 연결이 끊어졌어요.');this.leave();this.E.show('setup');return;}
    this.banner('⚠️ 방장과 연결이 끊어졌어요. 내 게임은 끝까지 할 수 있어요.');
    const me=this.me();if(me&&me.done&&!this.final)this.finalize();},
  banner(t){const s=$('.netstrip');if(s){const b=h('span','lb',t);b.style.color='var(--bad)';s.appendChild(b);}},
  every(ms,fn){const t=setInterval(fn,ms);this.timers.push(t);},
  me(){return this.roster.find(p=>p.id===this.myId);},

  /* ---------- 대기실 ---------- */
  setText(){const E=this.E,s=this.set||{};const L=E.G.levels.find(l=>l.id===s.level);
    return (L?`${L.g} · ${L.t}`:'')+(s.count?` · ${s.count}문제`:'')+(s.dur?` · ${s.dur%60?Math.floor(s.dur/60)+'분 '+s.dur%60+'초':s.dur/60+'분'}`:'');},
  showLobby(){const E=this.E,S=$('#lobby');S.innerHTML='';const host=this.role==='host';
    const W=h('div','nl-wrap');S.appendChild(W);const C=h('div','nl-card');W.appendChild(C);
    C.innerHTML=`<span class="nl-tag">${host?(this.watch?'🏠 방장 · 진행만':'🏠 방장'):'🚪 참가자'}</span><h2>${E.G.emoji} ${esc(E.G.title)} 대기실</h2>
      <div class="nl-hint">친구들에게 이 방 코드를 알려 주세요</div><div class="nl-code">${this.code}</div><div class="nl-set">${this.setText()}</div>`;
    const list=h('div','nl-list');C.appendChild(list);
    const ps=this.roster.filter(p=>!p.left);
    ps.forEach(p=>{list.appendChild(h('div','nl-p'+(p.id===this.myId?' me':''),`<span class="dot" style="background:${PHEX[p.ci]}"></span><span class="nm">${esc(p.nick)}</span><span class="bd">${p.id==='host'?'방장':''}${p.id===this.myId?' (나)':''}</span>`));});
    for(let k=ps.length;k<MAX;k++)list.appendChild(h('div','nl-p empty','<span class="dot" style="background:#e5e7eb"></span><span class="nm">기다리는 중…</span>'));
    C.appendChild(h('div','nl-hint',`들어온 사람 <b>${ps.length}</b> / ${MAX}명`));
    const bt=h('div','nl-btns');C.appendChild(bt);
    const leave=h('button','sub','나가기');leave.onclick=()=>{if(confirm(host?'방을 닫을까요? 친구들도 나가게 돼요.':'방에서 나갈까요?')){this.leave();E.show('setup');}};
    if(host){const ch=h('button','sub','⚙️ 설정 바꾸기');ch.onclick=()=>E.show('setup');
      const need=this.watch?1:2;const go=h('button','',`게임 시작! (${ps.length}명)`);go.disabled=ps.length<need;go.onclick=()=>this.hostStart();
      bt.append(leave,ch,go);
      if(ps.length<need)C.appendChild(h('div','nl-hint',this.watch?'한 명 이상 들어오면 시작할 수 있어요.':'친구가 한 명 이상 들어오면 시작할 수 있어요.'));}
    else{bt.append(leave);C.appendChild(h('div','nl-hint','⏳ 방장이 시작하기를 기다리고 있어요…'));}
    E.show('lobby');},

  /* ---------- 시작 ---------- */
  hostStart(){const seed=Math.floor(Math.random()*1e9);this.roster=this.roster.filter(p=>!p.left);
    const msg={t:'start',seed,set:this.set,roster:this.roster.map(p=>Object.assign({},p,{score:0,prog:0,done:false,k2:0,k3:0,line:''}))};
    this.bcast(msg);this.begin(msg);},
  begin(msg){const E=this.E;this.seed=msg.seed;this.set=msg.set;this.roster=msg.roster;this.started=true;this.final=false;
    clearTimeout(this.forceT);
    const c=E.cfg;c.mode='device';c.level=msg.set.level;if(msg.set.count)c.count=msg.set.count;if(msg.set.dur)c.dur=msg.set.dur;
    E.level=E.G.levels.find(l=>l.id===c.level);
    if(this.role==='host'&&this.watch){this.showBoard();if(msg.set.dur)this.forceT=setTimeout(()=>this.forceFinal(),(msg.set.dur+12)*1000);return;}
    c.nicks=[this.me()?this.me().nick:c.nicks[0]];
    E.start();},
  /* 플레이 화면 위쪽 실시간 점수 줄 */
  mountStrip(P){const s=h('div','netstrip');const bar=P.querySelector('.pbar');bar.after(s);this.renderLive();},
  sorted(){return this.roster.slice().sort((a,b)=>(a.left-b.left)||b.score-a.score||b.k2-a.k2||a.k3-b.k3);},
  renderLive(){const s=$('.netstrip');if(s){s.innerHTML=`<span class="lb">📡 방 ${this.code}</span>`;
      this.sorted().forEach((p,i)=>{s.appendChild(h('span','ch'+(p.id===this.myId?' me':'')+(p.done?' done':'')+(p.left?' left':''),`${p.left?'':(i+1)+'위'} <span class="dot" style="background:${PHEX[p.ci]}"></span>${esc(p.nick)} ${p.score}점${p.done?' ✅':''}`));});
      if(this.role==='host'&&!this.final){const b=h('button','endall','⏹ 모두 끝내기');b.onclick=()=>{if(confirm('지금 점수로 게임을 끝낼까요?'))this.forceFinal();};s.appendChild(b);}}
    if($('#netboard').classList.contains('on'))this.showBoard();},
  /* 진행만 하는 방장: 전자칠판 점수판 */
  showBoard(){const E=this.E,S=$('#netboard');S.innerHTML='';
    const W=h('div','nl-wrap');S.appendChild(W);const C=h('div','nl-card');W.appendChild(C);
    C.innerHTML=`<span class="nl-tag">📺 실시간 점수판</span><h2>${E.G.emoji} ${esc(E.G.title)}</h2><div class="nl-set">방 ${this.code} · ${this.setText()}</div>`;
    const list=h('div','nl-list');C.appendChild(list);
    this.sorted().forEach((p,i)=>{list.appendChild(h('div','nl-p'+(p.left?' left':''),`<span class="rk">${p.left?'🚪':p.done?'✅':(i+1)}</span><span class="dot" style="background:${PHEX[p.ci]}"></span><span class="nm">${esc(p.nick)}</span><span class="bar"><i style="width:${Math.round((p.prog||0)*100)}%;background:${PHEX[p.ci]}"></i></span><span class="pt">${p.score}점</span>`));});
    const bt=h('div','nl-btns');const end=h('button','sub','⏹ 지금 끝내기');end.onclick=()=>{if(confirm('지금 점수로 게임을 끝낼까요?'))this.forceFinal();};bt.appendChild(end);C.appendChild(bt);
    C.appendChild(h('div','nl-hint','모두 끝나면 자동으로 등수가 나와요.'));
    E.show('netboard');},

  /* ---------- 점수 보내기 ---------- */
  report(st){if(!this.on||!this.started)return;const me=this.me();if(!me)return;
    Object.assign(me,st);
    if(this.role==='host'){this.boardSync();this.checkDone();}
    else{try{this.conn&&this.conn.open&&this.conn.send(Object.assign({t:'sc'},st));}catch(e){}this.renderLive();
      if(st.done&&this.gone&&!this.final)this.finalize();}},
  boardSync(){this.bcast({t:'board',roster:this.roster});this.renderLive();},
  checkDone(){if(this.role!=='host'||this.final||!this.started)return;
    const act=this.roster.filter(p=>!p.left);if(act.length&&act.every(p=>p.done)){this.forceFinal();}},
  forceFinal(){if(this.role!=='host'||this.final)return;clearTimeout(this.forceT);this.bcast({t:'final',roster:this.roster});this.finalize();},
  finalize(){if(this.final)return;this.final=true;this.started=false;const E=this.E;
    E.stopAll&&E.stopAll();setTimeout(()=>E.results(),300);},

  /* ---------- 결과 화면 (모두의 등수) ---------- */
  results(W,unit){const E=this.E;const ps=this.sorted().filter(p=>!p.left);const gone=this.roster.filter(p=>p.left);
    const same=(a,b)=>a.score===b.score&&a.k2===b.k2&&a.k3===b.k3;ps.forEach((p,k)=>{p.rank=k&&same(p,ps[k-1])?ps[k-1].rank:k;});
    const tops=ps.filter(p=>p.rank===0);const me=this.me();
    W.appendChild(h('div','res-title',ps.length?(tops.length>1?`🏆 공동 1등! ${tops.map(p=>esc(p.nick)).join(', ')}`:`🏆 ${esc(ps[0].nick)} 승리!`):'게임 끝!'));
    if(me&&ps.length>1)W.appendChild(h('div','room-note',`나는 <b class="jua" style="font-size:24px">${me.rank+1}등</b>! · 방 ${this.code} · ${this.setText()}`));
    else W.appendChild(h('div','room-note',`방 ${this.code} · ${this.setText()}`));
    const pod=h('div','podium');W.appendChild(pod);
    ps.forEach(p=>{const c=h('div','pcard'+(p.id===this.myId?' nl-me':''));c.style.setProperty('--pc',PHEX[p.ci]);
      c.innerHTML=`<div class="rk">${ps.length>1?medal[Math.min(p.rank,3)]:'⭐'}</div><div class="nm">${esc(p.nick)}${p.id===this.myId?' (나)':''}</div><div class="pts">${N.comma(p.score)}${unit||'점'}</div><div class="st">${p.line||''}${p.done?'':' · 다 못 풀었어요'}</div>`;pod.appendChild(c);});
    if(gone.length)W.appendChild(h('div','hint',`🚪 중간에 나간 친구: ${gone.map(p=>esc(p.nick)).join(', ')}`));},
  buttons(W){const E=this.E;const bt=h('div','res-btns');
    if(this.role==='host'&&!this.gone){const again=h('button','','🔁 같은 방에서 한 판 더');again.onclick=()=>{this.final=false;this.started=false;this.roster.forEach(p=>Object.assign(p,{score:0,prog:0,done:false}));this.bcast({t:'lobby',roster:this.roster,set:this.set});this.showLobby();};
      const out=h('button','sub','방 닫기');out.onclick=()=>{this.leave();E.show('setup');};bt.append(again,out);}
    else{const out=h('button','sub','나가기');out.onclick=()=>{this.leave();E.show('setup');};bt.append(out);
      if(!this.gone)W.appendChild(h('div','hint','⏳ 방장이 한 판 더 하면 대기실로 자동으로 이동해요.'));}
    W.appendChild(bt);},

  leave(silent){this.timers.forEach(clearInterval);this.timers=[];clearTimeout(this.forceT);
    try{if(this.role==='host')this.bcast({t:'close'});else if(this.conn&&this.conn.open)this.conn.send({t:'bye'});}catch(e){}
    const p=this.peer;if(p)setTimeout(()=>{try{p.destroy();}catch(e){}},silent?0:200);
    Object.assign(this,{on:false,role:null,peer:null,conns:[],conn:null,roster:[],myId:null,started:false,final:false,gone:false});},
};
window.Net=Net;
})();


</script>
<script>
/* 6학년 과학 · 전기의 이용 — 정전 마을 전기 기사
   정전된 마을을 되살리는 전기 기사가 되어 회로 · 전기가 통하는 물체 · 전지/전구 연결 · 전자석 · 전기 안전을 해결해요.
   미션을 맞힐 때마다 아래 마을의 창문에 불이 하나씩 켜져요. */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeIO=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const plain=s=>String(s).replace(/<[^>]+>/g,'');
const hash=n=>{n=Math.imul(n^(n>>>16),0x45d9f3b);n=Math.imul(n^(n>>>15),0x45d9f3b);return((n^(n>>>16))>>>0)/4294967296;};
const COL={copper:'#e58a3a',copperD:'#8f4d14',copperL:'#ffc58a',volt:'#ffd23f',cyan:'#3ee6ff',mint:'#3df0b8',steel:'#a9b8d8',navy:'#0b1430',card:'#14214a',card2:'#1c2d62',bad:'#ff5a7a',paper:'#f5f1e6'};
const LOGO='<svg class="logo" viewBox="0 0 48 48"><path d="M24 3a15 15 0 0 0-8.5 27.4c1 .8 1.5 1.8 1.5 3V36h14v-2.6c0-1.2.5-2.2 1.5-3A15 15 0 0 0 24 3z" fill="#ffc92b"/><path d="M24 3a15 15 0 0 0-8.5 27.4c1 .8 1.5 1.8 1.5 3V36h7z" fill="#ffe27a"/><ellipse cx="17" cy="14" rx="4" ry="2.4" transform="rotate(-35 17 14)" fill="#fff9d6" opacity=".85"/><rect x="17" y="37" width="14" height="4" rx="2" fill="#94a3b8"/><rect x="19" y="42" width="10" height="3.5" rx="1.7" fill="#64748b"/><path d="M26 9l-8 13h5l-2 9 9-14h-5z" fill="#0b1430" opacity=".85"/></svg>';

/* ───────── 밤 마을: 창문에 불이 켜지는 도시 ───────── */
const Town={
  /* y: 땅(건물 아래쪽) 위치, H: 건물이 쓸 수 있는 높이. lit: 0~1 켜진 비율 */
  layer(g,W,y,H,lit,T,opt){const o=Object.assign({seed:3,far:false,col:'#101d46',top:'#1d2e68',wa:1,wsz:0},opt||{});
    const ws=o.wsz||clamp(H*.075,3,9),gap=ws*.95;let x=-ws,i=0;
    while(x<W+ws){const r=k=>hash(o.seed*977+i*31+k*7);
      const bw=Math.max(ws*3.2,W*(o.far?.05:.07)*(.65+r(1)*.95));const bh=H*((o.far?.34:.46)+r(2)*(o.far?.3:.52));const bx=x,by=y-bh;
      g.fillStyle=o.col;g.fillRect(bx,by,bw,bh);g.fillStyle=o.top;g.fillRect(bx,by,bw,Math.max(1.5,H*.012));
      if(!o.far&&r(3)>.72){g.fillStyle=o.col;g.fillRect(bx+bw*.45,by-H*.12,Math.max(1.5,ws*.3),H*.12);
        const bl=(Math.sin(T*3+i)>0)?1:.25;g.fillStyle=`rgba(255,80,100,${bl})`;g.beginPath();g.arc(bx+bw*.45+ws*.15,by-H*.12,Math.max(1.5,ws*.28),0,TAU);g.fill();}
      const cols=Math.max(1,Math.floor((bw-gap)/(ws+gap))),rows=Math.max(1,Math.floor((bh-gap*1.6)/(ws*1.25+gap)));
      const ox=bx+(bw-(cols*(ws+gap)-gap))/2;
      for(let rr=0;rr<rows;rr++)for(let cc=0;cc<cols;cc++){const th=hash(o.seed*131+i*977+rr*53+cc*11);
        const wx=ox+cc*(ws+gap),wy=by+gap*1.4+rr*(ws*1.25+gap);let on=th<lit*o.wa;
        if(on){const near=lit*o.wa-th;let a=1;if(near<.05)a=.45+.55*Math.abs(Math.sin(T*9+th*50));
          g.fillStyle=`rgba(255,214,90,${(.2*a).toFixed(3)})`;g.fillRect(wx-1.2,wy-1.2,ws+2.4,ws*1.25+2.4);
          g.fillStyle=th<.3?`rgba(255,238,170,${a})`:`rgba(255,206,92,${a})`;g.fillRect(wx,wy,ws,ws*1.25);}
        else{g.fillStyle=o.far?'#142354':'#1a2a5e';g.fillRect(wx,wy,ws,ws*1.25);}}
      x+=bw+ws*(.2+r(4)*.8);i++;}},
  draw(g,W,y,H,lit,T,seed){
    this.layer(g,W,y+H,H*.8,lit,T,{seed:seed+11,far:true,col:'#0b1636',top:'#14224f',wa:.9});
    this.layer(g,W,y+H,H,lit,T,{seed:seed,col:'#0f1b42',top:'#243a7c'});
    /* 가로등 */
    const n=Math.max(2,Math.round(W/160));for(let k=0;k<n;k++){const lx=W*(k+.5)/n+(hash(seed*5+k)-.5)*40,ly=y+H;

      if(lit>.05){K.glow(g,lx,ly-H*.2,H*.22,'#ffd77a',.25*lit);}}

/* 설정 화면 왼쪽 그림: 어두운 마을 → 전선을 따라 전기가 흐르며 창문이 하나씩 켜지고, 다시 정전 */
function heroScene(cv){const g=cv.getContext('2d');let raf=0,W=0,H=0,dpr=1,last=0,T=0,run=false;
  const size=()=>{const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);const w=Math.max(10,r.width),h=Math.max(10,r.height);
    if(w===W&&h===H&&d===dpr)return;W=w;H=h;dpr=d;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);};
  const powerAt=t=>{const c=t%17;if(c<1.6)return 0;if(c<10)return easeIO((c-1.6)/8.4);if(c<15)return 1;if(c<15.5)return .35+.65*Math.abs(Math.sin(c*30));return c<16.2?.15:0;};
  const wire=(x1,y1,x2,y2,sag)=>({x1,y1,x2,y2,cx:(x1+x2)/2,cy:y1+sag*2});
  const pt=(w,s)=>{const a=1-s;return[a*a*w.x1+2*a*s*w.cx+s*s*w.x2,a*a*w.y1+2*a*s*w.cy+s*s*w.y2];};
  const frame=now=>{if(!run)return;raf=requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;size();
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    const pw=powerAt(T),lit=pw;
    K.vgrad(g,0,0,W,H,['#03060f','#0b1432','#16296a']);
    K.stars(g,W,H*.62,T,Math.round(W/9),11,'#cfe0ff');
    K.glow(g,W*.8,H*.2,H*.16,'#bcd6ff',.22);g.fillStyle='#e8f0ff';g.beginPath();g.arc(W*.8,H*.2,H*.035,0,TAU);g.fill();g.fillStyle='#0b1432';g.beginPath();g.arc(W*.8+H*.012,H*.2-H*.006,H*.032,0,TAU);g.fill();
    const th=H*.5;const ty=H-th;
    Town.draw(g,W,ty,th,lit,T,4);
    /* 전신주와 전선 */
    const poleX=[W*.06,W*.5,W*.94],py=H*.5;
    const wires=[];for(let i=0;i<2;i++)for(let k=0;k<3;k++)wires.push(wire(poleX[i]+(k-1)*W*.012,py+k*H*.012-6,poleX[i+1]+(k-1)*W*.012,py+k*H*.012-6,H*.045+k*3));
    poleX.forEach(x=>{g.fillStyle='#0a1230';g.fillRect(x-3,py-8,6,H-py);g.fillRect(x-W*.03,py-6,W*.06,5);g.fillStyle='#16255a';g.fillRect(x-W*.03,py-6,W*.06,1.5);});
    g.save();g.lineWidth=2;g.strokeStyle='#5f78c4';wires.forEach(w=>{g.beginPath();g.moveTo(w.x1,w.y1);g.quadraticCurveTo(w.cx,w.cy,w.x2,w.y2);g.stroke();});g.restore();
    wires.forEach(w=>{for(let k=0;k<9;k++){const s=((T*.16+k/9)%1);const [x,y]=pt(w,s);
        const a=clamp(pw*1.4,0,1)*(.4+.6*Math.sin(s*Math.PI));if(a<.02)continue;g.fillStyle=`rgba(255,236,150,${a})`;g.beginPath();g.arc(x,y,2.4,0,TAU);g.fill();K.glow(g,x,y,9,'#ffd23f',.5*a);}});
    /* 변압기 불꽃 */
    const tx=poleX[1],tyy=py+H*.03;g.fillStyle='#17265a';K.rr(g,tx+6,tyy,W*.035,H*.045,3);g.fill();
    if(T%17<2.2&&Math.sin(T*40)>0){g.strokeStyle='#bff3ff';g.lineWidth=2;g.beginPath();let sx=tx+W*.02,sy=tyy-4;g.moveTo(sx,sy);for(let k=0;k<4;k++){sx+=(Math.random()-.5)*12;sy-=7;g.lineTo(sx,sy);}g.stroke();K.glow(g,tx+W*.02,tyy-10,22,'#9fe9ff',.7);}
    /* 큰 전구: 정전 → 점등 */
    const bx=W*.5,by=H*.43,br=Math.min(W,H)*.075;
    const lv=pw;K.glow(g,bx,by,br*(2.4+lv*3),'#ffd23f',.05+.4*lv);
    g.save();g.fillStyle=lv>.02?`rgba(255,${Math.round(190+60*lv)},${Math.round(70+120*lv)},${.35+.65*lv})`:'rgba(120,150,230,.25)';g.beginPath();g.arc(bx,by,br,0,TAU);g.fill();
    g.strokeStyle='rgba(210,225,255,.55)';g.lineWidth=2;g.stroke();g.restore();
    g.strokeStyle=lv>.05?'#fff':'#8fa0cc';g.lineWidth=2.4;g.beginPath();g.moveTo(bx-br*.3,by+br*.5);g.lineTo(bx-br*.3,by);g.lineTo(bx-br*.15,by-br*.2);g.lineTo(bx,by);g.lineTo(bx+br*.15,by-br*.2);g.lineTo(bx+br*.3,by);g.lineTo(bx+br*.3,by+br*.5);g.stroke();
    g.fillStyle='#8fa0cc';g.fillRect(bx-br*.38,by+br*.92,br*.76,br*.28);g.fillStyle='#667ab5';g.fillRect(bx-br*.3,by+br*1.22,br*.6,br*.2);
    g.strokeStyle='#5f78c4';g.lineWidth=2;g.beginPath();g.moveTo(bx,by-br);g.lineTo(bx,0);g.stroke();
    K.vignette(g,W,H,.28);};
  return{start(){if(run)return;run=true;last=performance.now();raf=requestAnimationFrame(frame);},stop(){run=false;cancelAnimationFrame(raf);}};}

/* ───────── 그리기 도구 ───────── */
const D={
  /* 구리 전선: pts=[[x,y],…] */
  wire(g,pts,lw,col,glow){g.save();g.lineCap='round';g.lineJoin='round';
    const path=()=>{g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));};
    g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=lw+3;path();g.stroke();
    if(glow){g.shadowColor=col;g.shadowBlur=lw*2.2;}g.strokeStyle=col;g.lineWidth=lw;path();g.stroke();g.shadowBlur=0;
    g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=Math.max(1,lw*.28);path();g.stroke();g.restore();},
  /* 폴리라인 위의 점(0~len) */
  along(pts,d){let tot=0;const seg=[];for(let i=0;i<pts.length-1;i++){const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(l);tot+=l;}
    d=((d%tot)+tot)%tot;for(let i=0;i<seg.length;i++){if(d<=seg[i]){const t=seg[i]?d/seg[i]:0;return[lerp(pts[i][0],pts[i+1][0],t),lerp(pts[i][1],pts[i+1][1],t)];}d-=seg[i];}return pts[0];},
  len(pts){let t=0;for(let i=0;i<pts.length-1;i++)t+=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);return t;},
  dots(g,pts,T,speed,n,r,col='#fff6c0'){const L=D.len(pts);for(let k=0;k<n;k++){const [x,y]=D.along(pts,(T*speed+k*L/n));g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();K.glow(g,x,y,r*3.2,'#ffd23f',.5);}},
  /* 전구(유리구): level 0~1, rem이면 빠진 자리 */
  bulb(g,cx,cy,r,level,T,rem){
    if(rem){g.save();g.strokeStyle='rgba(159,176,230,.6)';g.lineWidth=Math.max(1.5,r*.1);g.setLineDash([r*.28,r*.22]);g.beginPath();g.arc(cx,cy,r,0,TAU);g.stroke();g.restore();
      g.fillStyle='#7d8fc4';K.rr(g,cx-r*.5,cy-r*.28,r,r*.56,r*.12);g.fill();return;}
    if(level>0){K.glow(g,cx,cy,r*(2.1+level*2.4),'#ffd84a',.1+.5*level);}
    g.save();const gr=g.createRadialGradient(cx-r*.3,cy-r*.35,r*.1,cx,cy,r);
    if(level>0){gr.addColorStop(0,`rgba(255,253,230,${.8+.2*level})`);gr.addColorStop(.55,`rgba(255,${Math.round(214+30*level)},${Math.round(80+90*level)},1)`);gr.addColorStop(1,`rgba(255,${Math.round(150+50*level)},40,1)`);}
    else{gr.addColorStop(0,'rgba(120,145,215,.45)');gr.addColorStop(1,'rgba(30,45,100,.7)');}
    g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,TAU);g.fill();g.strokeStyle=level>0?'rgba(255,255,255,.7)':'rgba(190,210,255,.5)';g.lineWidth=Math.max(1.5,r*.09);g.stroke();
    g.strokeStyle=level>0?'#fff':'#8fa0cc';g.lineWidth=Math.max(1.4,r*.1);g.lineCap='round';g.lineJoin='round';g.beginPath();
    g.moveTo(cx-r*.34,cy+r*.55);g.lineTo(cx-r*.34,cy+r*.02);g.lineTo(cx-r*.17,cy-r*.22);g.lineTo(cx,cy+r*.02);g.lineTo(cx+r*.17,cy-r*.22);g.lineTo(cx+r*.34,cy+r*.02);g.lineTo(cx+r*.34,cy+r*.55);g.stroke();
    g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(cx-r*.42,cy-r*.5,r*.24,r*.12,-.6,0,TAU);g.fill();g.restore();},
  /* 건전지: (cx,cy) 중심, 길이 len, 굵기 th, 각도 ang(+극이 +x 쪽). 글자는 똑바로 */
  battery(g,cx,cy,len,th,ang,o={}){const c=Math.cos(ang),s=Math.sin(ang);
    g.save();g.translate(cx,cy);g.rotate(ang);const x=-len/2,y=-th/2;
    g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=th*.25;g.shadowOffsetY=th*.1;K.rr(g,x,y,len*.94,th,th*.22);g.fillStyle='#0d1530';g.fill();g.shadowBlur=0;g.shadowOffsetY=0;
    g.save();K.rr(g,x,y,len*.94,th,th*.22);g.clip();

  knife(g,cx,cy,len,ang,closed,T,pulse){g.save();g.translate(cx,cy);g.rotate(ang);const w=len,h=len*.34;
    g.fillStyle='#0a1230';K.rr(g,-w/2,-h/2,w,h,h*.3);g.fill();g.strokeStyle='#3b4f94';g.lineWidth=Math.max(1,len*.02);g.stroke();

    g.restore();},
  /* 악어 클립: 아래쪽 평면에서 dir(+1:오른쪽을 향함 −1:왼쪽) 방향으로 입을 벌려요 */

    g.fillStyle=col||'#ff5a7a';K.rr(g,-s*.95,-s*.22,s*.8,s*.44,s*.12);g.fill();g.fillStyle='rgba(255,255,255,.25)';K.rr(g,-s*.9,-s*.18,s*.7,s*.12,s*.05);g.fill();
    const a=open*.5;g.fillStyle='#c4cfe8';
    g.save();g.rotate(-a);g.beginPath();g.moveTo(-s*.2,-s*.2);g.lineTo(s*.62,-s*.07);g.lineTo(s*.62,0);g.lineTo(-s*.2,0);g.closePath();g.fill();g.fillStyle='#8896b8';for(let i=0;i<4;i++){g.fillRect(s*.12+i*s*.12,0,s*.06,s*.06);}g.restore();
    g.save();g.rotate(a);g.fillStyle='#aebad6';g.beginPath();g.moveTo(-s*.2,s*.2);g.lineTo(s*.62,s*.07);g.lineTo(s*.62,0);g.lineTo(-s*.2,0);g.closePath();g.fill();g.restore();
    g.restore();},
  paperclip(g,x,y,s,rot,col){g.save();g.translate(x,y);g.rotate(rot);g.strokeStyle=col||'#b9c4de';g.lineWidth=Math.max(1.4,s*.14);g.lineCap='round';g.lineJoin='round';

  label(g,str,x,y,size,col='#cbd7fb',o={}){K.txt(g,str,x,y,Object.assign({size,color:col,font:'IBM Plex Sans KR'},o));},
};

function wrap2(str){const w=String(str).split(' ');if(w.length<2)return[str];let best=1,bd=1e9;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' ').length,b=w.slice(i).join(' ').length;if(Math.abs(a-b)<bd){bd=Math.abs(a-b);best=i;}}return[w.slice(0,best).join(' '),w.slice(best).join(' ')];}
const M5={
  init(p){const st=p.state,R=p.R;const nb=R.int(2,4);const bad=R.sample(SAFE.filter(s=>s.bad),nb),ok=R.sample(SAFE.filter(s=>!s.bad),6-nb);
    st.cards=R.shuffle([...bad,...ok]).map(o=>({...o,fixed:false,shake:0,wrong:false}));st.need=nb;st.fixedN=0;st.lock=false;
    p.ask(`🔍 <b>위험하거나 전기를 낭비</b>하는 모습 <b>${nb}곳</b>을 찾아 눌러요`,'올바른 행동을 누르면 감점이에요');p.tools([],()=>{});},
  lay(p){const A=areaOf(p),u=p.u;const land=A.w>A.h*1.05;const cols=land?3:2,rows=land?2:3;const m=u*.3,gp=u*.3;
    const cw=(A.w-m*2-gp*(cols-1))/cols,ch=(A.h-m*2-gp*(rows-1))/rows;const out=[];
    for(let i=0;i<6;i++){const c=i%cols,r=Math.floor(i/cols);out.push({x:m+c*(cw+gp),y:m+r*(ch+gp),w:cw,h:ch});}return out;},
  down(p,x,y){const st=p.state;if(st.lock)return;const L=this.lay(p);
    for(let i=0;i<6;i++){if(!K.inRect(x,y,L[i]))continue;const c=st.cards[i];if(c.fixed||c.wrong)return;const r=L[i];
      if(c.bad){c.fixed=true;st.fixedN++;zap(p);goodHit(p,90,r.x+r.w/2,r.y+r.h*.4,`<b>${c.tag}</b> · ${c.note}`);
        if(st.fixedN>=st.need){st.lock=true;nextRound(p,1100);}}
      else{c.wrong=true;c.shake=.5;p.hit(false,{pen:30,x:r.x+r.w/2,y:r.y+r.h*.4,tip:`<b>${c.name}</b>: ${c.note}`,tipMs:3000,review:`${c.name} → ${plain(c.note)}`});}
      return;}},
  draw(p,g,A,dt){const st=p.state,u=p.u;const L=this.lay(p);const a=intro(p);g.save();g.globalAlpha=a;g.translate(0,(1-a)*u*.6);
    st.cards.forEach((c,i)=>{const r=L[i];c.shake=Math.max(0,c.shake-dt);const sx=c.shake>0?Math.sin(c.shake*60)*u*.12:0;
      g.save();g.translate(sx,0);
      const bg=c.fixed?'#134638':c.wrong?'#3a2540':'#1a2a60';const bd=c.fixed?'rgba(61,240,184,.85)':c.wrong?'rgba(255,90,122,.6)':'rgba(120,150,255,.38)';
      K.card(g,r.x,r.y,r.w,r.h,u*.3,bg,{blur:u*.3,dy:u*.1,stroke:bd,lw:c.fixed?3:1.5,hi:false});
      const isz=Math.min(r.w*.62,r.h*.56);const cx=r.x+r.w/2,cy=r.y+r.h*.4;
      g.save();g.translate(cx,cy);g.scale(isz/100,isz/100);g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=isz*.1;SI[c.id](g);g.restore();
      const fs=clamp(Math.min(r.h*.115,r.w*.092),11,20);const ls=wrap2(c.name);const ly=r.y+r.h*.8;
      ls.forEach((s,k)=>K.txt(g,s,cx,ly+(k-(ls.length-1)/2)*fs*1.2,{size:fs,maxW:r.w*.94,color:c.fixed?'#c9fff0':'#e8eeff'}));
      if(c.fixed){K.box(g,r.x+r.w*.5-u*1.35,r.y+u*.2,u*2.7,u*.75,u*.25,TAGC[c.tag]||'#4da3ff');K.txt(g,c.tag,r.x+r.w*.5,r.y+u*.58,{size:clamp(u*.42,11,17),color:'#fff'});
        g.save();g.strokeStyle='#3df0b8';g.lineWidth=u*.22;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(cx-isz*.2,cy+isz*.02);g.lineTo(cx-isz*.04,cy+isz*.18);g.lineTo(cx+isz*.24,cy-isz*.16);g.stroke();g.restore();}
      if(c.wrong){K.emo(g,'❌',r.x+r.w-u*.7,r.y+u*.7,u*.8);}
      g.restore();});
    g.restore();}
};
